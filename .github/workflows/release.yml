name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, such as v0.11.0"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate version and draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      proceed: ${{ steps.version.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.11.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate tag and version consistency
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            PROCEED=true
          else
            VERSION=$(node -e "console.log(require('./apps/desktop/package.json').version)")
            TAG="v$VERSION"
          fi
          node scripts/check-versions.mjs "$TAG"

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Release tag $TAG already exists; main update has no new version."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            PROCEED=true
          fi
          version=$(node -e "console.log(require('./apps/desktop/package.json').version)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

      - name: Create or verify draft release
        if: steps.version.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Karen ${TAG#v}" --generate-notes
          fi

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, target: aarch64-apple-darwin, os: macos }
          - { name: Linux x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, os: linux }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10.11.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2

      - name: macOS Signing & Notarization Preflight
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "=== macOS Release Preflight ==="
          missing=()
          [ -z "$APPLE_CERTIFICATE_BASE64" ] && missing+=("APPLE_CERTIFICATE_BASE64")
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -z "$APPLE_SIGNING_IDENTITY" ] && missing+=("APPLE_SIGNING_IDENTITY")
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          [ -z "$APPLE_API_KEY_ID" ] && missing+=("APPLE_API_KEY_ID")
          [ -z "$APPLE_API_PRIVATE_KEY" ] && missing+=("APPLE_API_PRIVATE_KEY")
          [ -z "$APPLE_API_ISSUER" ] && missing+=("APPLE_API_ISSUER")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Apple signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::Configured Developer ID signing identity was not imported into the temporary keychain."
            exit 1
          fi

          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$AUTH_KEY_PATH"
          if ! xcrun notarytool history --key "$AUTH_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json >/dev/null 2>&1; then
            echo "::error::Apple notarization authentication preflight failed."
            exit 1
          fi

          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Updater signing key preflight
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY; the in-app updater needs signed update archives."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      # Updater archives are only built for releases, so local and PR builds need no signing key.
      - run: pnpm tauri --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package Desktop Installer (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          dmg=$(ls target/release/bundle/dmg/*.dmg 2>/dev/null | head -n 1)
          if [ -z "$dmg" ]; then
            echo "::error::Expected macOS DMG missing in target/release/bundle/dmg"
            exit 1
          fi
          cp "$dmg" dist/
          archive=$(ls target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n 1)
          if [ -z "$archive" ] || [ ! -f "$archive.sig" ]; then
            echo "::error::Expected signed macOS updater archive (.app.tar.gz and .sig) in target/release/bundle/macos"
            exit 1
          fi
          cp "$archive" "$archive.sig" dist/
          (cd dist && shasum -a 256 * > SHA256SUMS-desktop-macos)

      - name: Package Desktop Installers (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          missing=0
          deb=$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          appimage=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1)
          if [ -z "$deb" ]; then
            echo "::error::Expected Linux .deb missing in target/release/bundle/deb"
            missing=1
          fi
          if [ -z "$appimage" ]; then
            echo "::error::Expected Linux .AppImage missing in target/release/bundle/appimage"
            missing=1
          fi
          if [ ! -f "$appimage.sig" ]; then
            echo "::error::Expected signed Linux updater signature $appimage.sig"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          cp "$deb" "$appimage" "$appimage.sig" dist/
          (cd dist && shasum -a 256 * > SHA256SUMS-desktop-linux)

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Consolidate checksums and publish release
    needs: [prepare, build-desktop]
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Generate updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          node scripts/updater-manifest.mjs dist "$TAG" "$GITHUB_REPOSITORY" "$notes"

      - name: Generate master SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS* *.sha256
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # skip-github-release stops Release Please from retagging its own PR, and it refuses to open
  # the next version PR while a merged one is still "pending". Manual dispatches rebuild old tags
  # and must not tag a newer version PR that is still waiting for promotion.
  tag-release-pr:
    name: Mark merged release PR as tagged
    needs: [prepare, publish]
    if: needs.prepare.outputs.proceed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Flip autorelease label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh label create "autorelease: tagged" --repo "$GITHUB_REPOSITORY" \
            --color EDEDED --description "Release PR whose release has been published" 2>/dev/null || true
          gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state merged \
            --label "autorelease: pending" --json number --jq '.[].number' |
          while read -r number; do
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --remove-label "autorelease: pending" --add-label "autorelease: tagged"
            echo "Marked #$number as tagged." >> "$GITHUB_STEP_SUMMARY"
          done

  homebrew-tap-pr:
    name: Package manager pull request (luban-homebrew)
    needs: [prepare, publish]
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Check Homebrew PAT availability
        id: check-token
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_PAT not set; skipping automated Homebrew tap PR."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Homebrew tap and create PR
        if: steps.check-token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --branch develop https://x-access-token:${GH_TOKEN}@github.com/systembugtj/luban-homebrew.git tap
          cd tap

          branch="bump-karen-${TAG}"
          git checkout -b "$branch"

          if [ -f Casks/karen.rb ]; then
            dmg_url="https://github.com/commandotj/ax-karen/releases/download/${TAG}/Karen_${VERSION}_aarch64.dmg"
            sha=$(curl -sL "${dmg_url}" | sha256sum | awk '{print $1}')
            sed -i "s|url \".*\"|url \"${dmg_url}\"|" Casks/karen.rb
            sed -i "s|version \".*\"|version \"${VERSION}\"|" Casks/karen.rb
            sed -i "s|sha256 \".*\"|sha256 \"${sha}\"|" Casks/karen.rb
            git add Casks/karen.rb
          fi

          if git diff --staged --quiet; then
            echo "No cask changes staged; tap is already up to date or cask not yet registered."
          else
            git commit -m "chore(karen): bump to ${TAG}"
            git push origin "$branch"
            gh pr create --repo systembugtj/luban-homebrew \
              --head "$branch" \
              --base develop \
              --title "chore(karen): update to ${TAG}" \
              --body "Automated release update for Karen ${TAG}."
          fi
