name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, such as v0.11.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate version and draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Karen ${TAG#v}" --generate-notes
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: ubuntu-24.04, arch: x86_64, os: linux }
          - { name: Linux aarch64, runner: ubuntu-24.04-arm, arch: aarch64, os: linux }
          - { name: macOS arm64, runner: macos-15, arch: aarch64, os: macos }
          - { name: macOS Intel, runner: macos-15-intel, arch: x86_64, os: macos }
          - { name: Windows x86_64, runner: windows-2025, arch: x86_64, os: windows }
          - { name: Windows arm64, runner: windows-11-arm, arch: aarch64, os: windows }
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2

      - name: Prepare notarization key
        if: matrix.os == 'macos' && env.NOTARY_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: cargo xtask test
      - run: pnpm tauri

      - name: Package standalone CLI and desktop bundle
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          OS_NAME: ${{ matrix.os }}
        run: |
          mkdir -p dist
          cli="karen-$VERSION-$ARCH-$OS_NAME.tar.gz"
          tar -C target/release -czf "dist/$cli" karen
          bundle="karen-app-$VERSION-$ARCH-$OS_NAME.tar.gz"
          tar -C apps/desktop/src-tauri/target/release/bundle \
            -czf "dist/$bundle" .
          (cd dist && shasum -a 256 "$cli" "$bundle" > "SHA256SUMS-$OS_NAME-$ARCH")

      - name: Package standalone CLI and desktop bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $cli = "karen-$env:VERSION-$env:ARCH-windows.zip"
          Compress-Archive -Path target/release/karen.exe -DestinationPath "dist/$cli"
          $bundle = "karen-app-$env:VERSION-$env:ARCH-windows.zip"
          Compress-Archive -Path apps/desktop/src-tauri/target/release/bundle/* -DestinationPath "dist/$bundle"
          $hashes = Get-ChildItem dist/*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllLines("dist/SHA256SUMS-windows-$env:ARCH", $hashes)

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach artifacts and publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
