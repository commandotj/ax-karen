name: Release Please

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update version PR
    runs-on: ubuntu-24.04
    steps:
      - name: Require workflow-enabled GitHub token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Configure repository secret RELEASE_PLEASE_TOKEN with Contents and Pull requests read/write access."
            exit 1
          fi

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report version pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          if [ "$PRS_CREATED" = "true" ]; then
            echo "Release Please opened or updated version pull request:"
            echo "$RELEASE_PRS"
            {
              echo "### Release Please"
              echo
              echo '```json'
              echo "$RELEASE_PRS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # skip-github-release keeps the merged version PR "pending" until main publishes the tag,
            # so Release Please aborts here by design. Tell that wait apart from a real no-op.
            merged_pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state merged \
              --label "autorelease: pending" --json number --jq 'length')
            if [ "$merged_pending" -gt 0 ]; then
              promotion=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
                --head "$GITHUB_REPOSITORY_OWNER:develop" --state open --json url --jq '.[0].url // empty')
              if [ -n "$promotion" ]; then
                echo "No version PR: waiting for production tag after promotion ($promotion). No tag or release exists yet." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Merged version PR is still autorelease: pending and no promotion PR is open. Check the Promote workflow."
              fi
            else
              echo "Release Please completed without opening or updating a version pull request."
            fi
          fi
