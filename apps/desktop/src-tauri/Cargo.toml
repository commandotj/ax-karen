[package]
name = "karen-desktop"
version = "0.12.0"
description = "Karen desktop shell"
authors = ["Karen contributors"]
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

