[package]
name = "karen-desktop"
version = "0.14.0"
description = "Karen desktop shell"
authors = ["Karen contributors"]
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Needed by the generate_context! expansion once tauri.conf.json has a plugins section.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

