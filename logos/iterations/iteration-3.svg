<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Karen — Brass Sector Panel Meter Icon</title>
  <g id="background">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="#181510"/>
    <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="#8C6B2B" stroke-width="8"/>
  </g>
  <g id="icon">
    <!-- Solid antique-brass panel meter casing -->
    <rect x="48" y="68" width="416" height="376" rx="60" fill="#C9A24D"/>
    <rect x="66" y="86" width="380" height="340" rx="44" fill="none" stroke="#EFCB70" stroke-width="8"/>
    <!-- Four heavy corner rivets knocked out in dark enamel -->
    <circle cx="96" cy="116" r="15" fill="#181510"/>
    <circle cx="416" cy="116" r="15" fill="#181510"/>
    <circle cx="96" cy="396" r="15" fill="#181510"/>
    <circle cx="416" cy="396" r="15" fill="#181510"/>
    <!-- Deep dark-enamel fan-shaped sector window (figure-ground) -->
    <path d="M 256 368 L 84 196 A 243 243 0 0 1 428 196 Z" fill="#101416"/>
    <!-- Outer copper high-pressure arc cleanly separated along upper right rim -->
    <path d="M 332 136 A 216 216 0 0 1 398 188" fill="none" stroke="#C4703F" stroke-width="18" stroke-linecap="round"/>
    <!-- Bold ivory engraved scale ticks inset from rim with zero overlap -->
    <path d="M 128 202 L 156 230 M 184 156 L 200 188 M 256 140 L 256 176 M 378 206 L 350 234" stroke="#F0E4C6" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Bold burnished-gold indicator needle with rounded tip that survives 16px -->
    <path d="M 256 368 L 318 162" stroke="#EFCB70" stroke-width="24" stroke-linecap="round"/>
    <polygon points="324,146 278,368 234,368" fill="#EFCB70"/>
    <!-- Heavy brass pivot boss and ivory center jewel -->
    <circle cx="256" cy="368" r="46" fill="#C9A24D"/>
    <circle cx="256" cy="368" r="22" fill="#181510"/>
    <circle cx="256" cy="368" r="10" fill="#F0E4C6"/>
  </g>
</svg>
