 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design\n\nUse the preserved GPUI implementation in `migration/gpui-reference/` as the\nbehavioral reference. Use its README\nscreen description as the layout reference. Keep the full `Node` tree, marks,\nselection, scan root and review plan in the CLI/core. Extend the CLI JSON-line\nprotocol with bounded requests and events for cached tree navigation,\nbreadcrumbs, sibling choices, selection, marks, review and removal\nconfirmation. Keep Vue as a renderer and input surface; do not move filesystem\noperations, tree ownership or deletion policy into Tauri or Vue.\n\nThe CLI retains completed per-volume trees for the lifetime of the app process.\nNavigating within a cached tree resolves paths against that tree and returns\nonly the current bounded treemap tiles, breadcrumbs, sibling list, selection\ndetails, totals and marks summary. A cache miss starts a scan. Explicit rescan\nreplaces only that volume's cached tree after successful completion; failed or\ncancelled scans leave the prior completed tree available. Tile and breadcrumb\nactions address absolute paths so tree layout sorting cannot redirect a\nselection. Vue reproduces the source screen's hierarchy: controls and trail at\ntop, totals/filter/legend above the mosaic, mosaic as the main work surface,\nand selection/mark/volume information in its side panel, followed by a\nseparate review and confirmation flow.\n"},"source-cd772afa8730c301-s7":{"body":"来源：`.spec/rfc/0006-karen-disk-tree-ui-migration.md:68-81`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\nCompare each Disk Tree state and interaction against the preserved source:\ninitial scan, scan progress, root mosaic, nested directory, breadcrumb\nreturn, sibling jump, volume switch, cached revisit, explicit rescan,\nselection, mark/unmark, review, cancel, confirm and removal result. Confirm\ntile navigation, breadcrumb return and cached volume revisit issue no scan\nrequest. Confirm cache miss scans once and failed/cancelled rescan preserves\nthe prior tree. Confirm Vue receives bounded view payloads rather than a\nserialized full tree. Preserve core removal guards and free-space attribution.\nRun focused CLI/protocol and desktop coverage, Rust lint/build and desktop\nbuild; manually inspect the running app against the source screen at normal\nand large viewport sizes. Validate RFC 0004 and RFC 0006 consistency after\nimplementation."},"source-8261097cd58664b1":{"body":"# .spec/rfc/0007-usable-system-monitor-experience.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0007: Make Karen a usable live system monitor (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n\n## Summary\n\nRedesign Karen's monitoring views as a usable live system monitor with a\nhighly visual Runtime instrument panel and dedicated CPU, Memory and Disk Tree\ndetail tabs. Runtime visualizes every supported resource together; a compact\nreadout table may support exact values but must not dominate the screen. CPU\ndetail shows per-process CPU usage; Memory detail shows per-process memory\nusage; Disk Tree shows the original Karen space view specified by RFC 0006.\nRuntime disk instruments open the corresponding Disk Tree/space view. Do not\nadd a separate Volumes tab. The interface must feel richly luxurious and\nornamented, not clean or minimal.\n\n## Problem\n\nThe current desktop is too clean and presents resource readings as sparse\ndashboard cards. It lacks the visual richness and instrument-like hierarchy\nneeded for a luxurious steampunk monitor, while also failing to make\nper-process CPU/memory usage and disk space legible. Disk information needs a\ndirect route into the dedicated space treemap.\n\n## Goals\n\nMake all resources Karen currently supports legible, visual and actionable at\na glance. Runtime shows CPU utilization, physical-memory usage, and every\nmounted disk/volume's used and available space together. CPU and memory\ninstruments include concise process-usage summaries; their detail tabs show\nthe full bounded process lists. Pair gauges, live traces, segmented capacity\nrings/bars, engraved scales and luminous state indicators with exact numeric\nreadouts. Disk instruments are clickable and open the matching Disk Tree/space\nview. Disk Tree remains a dedicated view. The app opens on Runtime and does\nnot start a filesystem scan until the user opens Disk Tree.\n\n## Non-goals\n\nProcess CPU collection and stream schema (RFC 0005), Disk Tree behavior and\ncached navigation (RFC 0006), process memory collection/schema (RFC 0008),\ndisk I/O throughput, network telemetry, alerts, historical recording, remote\nmonitoring, new sampling backends, and changes to deletion or filesystem\npolicies.\n\n## Design\n\nRestructure `apps/desktop/src/App.vue` into Runtime, CPU, Memory and Disk Tree\nviews and update `apps/desktop/src/style.css` to create a dense, richly\nornamented instrument console. Runtime is the default visual monitor panel\nand contains every supported resource: CPU, physical memory and each mounted\ndisk/volume. Show CPU load as a mechanical dial/gauge with a live trace;\nmemory as a capacity instrument with used/available portions; each mounted\ndisk as an engraved capacity meter or ring with free-space reading and a click\ntarget into Disk Tree. Include concise CPU-process and memory-process usage\nsummaries, with full bounded lists in their respective detail tabs. Add a\ncompact exact-value ledger as supporting detail, never as the dominant visual.\nUse layered brass/copper frames, engraved ticks,\nfiligree corners, inset enamel panels, warm specular highlights, and selective\nindicator glow. Preserve readable typography and clear visual hierarchy; do\nnot simplify the visual treatment into generic flat cards, large whitespace,\nor a plain table. CPU detail includes a bounded per-process CPU table supplied\nby RFC 0005. Memory detail includes system totals/availability and a bounded\nper-process memory table supplied by RFC 0008. Disk Tree owns its dedicated\nlayout and controls from RFC 0006. Do not create a separate Volumes tab.\n\nUse CLI stream data only; Vue formats and displays it. Keep existing\nthree-second sample cadence unless RFC 0003 or RFC 0005 implementation\nconstraints require a documented adjustment. Preserve the custom title bar,\nmacOS traffic lights, tab navigation, accessibility labels and luxuriously\nornamented steampunk palette. Do not automatically launch a disk scan from\nRuntime or Volumes.\n\n## Acceptance\n\nOn launch, Runtime is selected and visualizes every supported resource:\nsystem CPU, physical memory, and every mounted disk/volume. Each resource has\ndistinct instrument graphics, exact readings, and concise process-usage\nsummaries where process data applies. CPU and Memory detail tabs show bounded\nper-process usage lists with stable identity and explicit unavailable states.\nDisk instruments open their matching Disk Tree/space view. Runtime visibly\nreads as a richly ornamented luxury steampunk\ninstrument panel, not a clean dashboard or table. Disk Tree retains original\nKaren behavior; no Volumes tab exists. Launching or switching monitor tabs\ndoes not start a disk scan. The window keeps custom chrome and macOS traffic\nlights. Verify live updates, empty/unavailable states, narrow and large\nwindow layouts, and keyboard-accessible tabs. Build the desktop and manually\ninspect each view; run `specify validate` after dependent RFCs 0005, 0006 and\n0008 are approved and integrated."},"source-8261097cd58664b1-s1":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0007: Make Karen a usable live system monitor (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n"},"source-8261097cd58664b1-s2":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:7-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nRedesign Karen's monitoring views as a usable live system monitor with a\nhighly visual Runtime instrument panel and dedicated CPU, Memory and Disk Tree\ndetail tabs. Runtime visualizes every supported resource together; a compact\nreadout table may support exact values but must not dominate the screen. CPU\ndetail shows per-process CPU usage; Memory detail shows per-process memory\nusage; Disk Tree shows the original Karen space view specified by RFC 0006.\nRuntime disk instruments open the corresponding Disk Tree/space view. Do not\nadd a separate Volumes tab. The interface must feel richly luxurious and\nornamented, not clean or minimal.\n"},"source-8261097cd58664b1-s3":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:19-26`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nThe current desktop is too clean and presents resource readings as sparse\ndashboard cards. It lacks the visual richness and instrument-like hierarchy\nneeded for a luxurious steampunk monitor, while also failing to make\nper-process CPU/memory usage and disk space legible. Disk information needs a\ndirect route into the dedicated space treemap.\n"},"source-8261097cd58664b1-s4":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:27-38`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\nMake all resources Karen currently supports legible, visual and actionable at\na glance. Runtime shows CPU utilization, physical-memory usage, and every\nmounted disk/volume's used and available space together. CPU and memory\ninstruments include concise process-usage summaries; their detail tabs show\nthe full bounded process lists. Pair gauges, live traces, segmented capacity\nrings/bars, engraved scales and luminous state indicators with exact numeric\nreadouts. Disk instruments are clickable and open the matching Disk Tree/space\nview. Disk Tree remains a dedicated view. The app opens on Runtime and does\nnot start a filesystem scan until the user opens Disk Tree.\n"},"source-8261097cd58664b1-s5":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:39-46`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Non-goals\n\nProcess CPU collection and stream schema (RFC 0005), Disk Tree behavior and\ncached navigation (RFC 0006), process memory collection/schema (RFC 0008),\ndisk I/O throughput, network telemetry, alerts, historical recording, remote\nmonitoring, new sampling backends, and changes to deletion or filesystem\npolicies.\n"},"source-8261097cd58664b1-s6":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:47-74`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design\n\nRestructure `apps/desktop/src/App.vue` into Runtime, CPU, Memory and Disk Tree\nviews and update `apps/desktop/src/style.css` to create a dense, richly\nornamented instrument console. Runtime is the default visual monitor panel\nand contains every supported resource: CPU, physical memory and each mounted\ndisk/volume. Show CPU load as a mechanical dial/gauge with a live trace;\nmemory as a capacity instrument with used/available portions; each mounted\ndisk as an engraved capacity meter or ring with free-space reading and a click\ntarget into Disk Tree. Include concise CPU-process and memory-process usage\nsummaries, with full bounded lists in their respective detail tabs. Add a\ncompact exact-value ledger as supporting detail, never as the dominant visual.\nUse layered brass/copper frames, engraved ticks,\nfiligree corners, inset enamel panels, warm specular highlights, and selective\nindicator glow. Preserve readable typography and clear visual hierarchy; do\nnot simplify the visual treatment into generic flat cards, large whitespace,\nor a plain table. CPU detail includes a bounded per-process CPU table supplied\nby RFC 0005. Memory detail includes system totals/availability and a bounded\nper-process memory table supplied by RFC 0008. Disk Tree owns its dedicated\nlayout and controls from RFC 0006. Do not create a separate Volumes tab.\n\nUse CLI stream data only; Vue formats and displays it. Keep existing\nthree-second sample cadence unless RFC 0003 or RFC 0005 implementation\nconstraints require a documented adjustment. Preserve the custom title bar,\nmacOS traffic lights, tab navigation, accessibility labels and luxuriously\nornamented steampunk palette. Do not automatically launch a disk scan from\nRuntime or Volumes.\n"},"source-8261097cd58664b1-s7":{"body":"来源：`.spec/rfc/0007-usable-system-monitor-experience.md:75-90`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\nOn launch, Runtime is selected and visualizes every supported resource:\nsystem CPU, physical memory, and every mounted disk/volume. Each resource has\ndistinct instrument graphics, exact readings, and concise process-usage\nsummaries where process data applies. CPU and Memory detail tabs show bounded\nper-process usage lists with stable identity and explicit unavailable states.\nDisk instruments open their matching Disk Tree/space view. Runtime visibly\nreads as a richly ornamented luxury steampunk\ninstrument panel, not a clean dashboard or table. Disk Tree retains original\nKaren behavior; no Volumes tab exists. Launching or switching monitor tabs\ndoes not start a disk scan. The window keeps custom chrome and macOS traffic\nlights. Verify live updates, empty/unavailable states, narrow and large\nwindow layouts, and keyboard-accessible tabs. Build the desktop and manually\ninspect each view; run `specify validate` after dependent RFCs 0005, 0006 and\n0008 are approved and integrated."},"source-f34da18b92e4671a":{"body":"# .spec/rfc/0008-per-process-memory-usage.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0008: Report per-process memory usage (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n\n## Summary\n\nAdd read-only per-process memory sampling to Karen's CLI monitor stream so the\nMemory tab can show which processes currently hold the most memory. Keep\ncollection in `monitor-memory`/`monitor-core` and deliver bounded process rows\nto the Vue shell, with platform-specific meaning documented.\n\n## Problem\n\nKaren currently reports only whole-machine memory totals. Users cannot tell\nwhich processes account for memory use, leaving the Memory view without the\nper-process breakdown required by the monitoring design. RFC 0003 excluded\nprocess monitoring, and RFC 0005 covers CPU process usage only.\n\n## Goals\n\nCollect each visible process's stable identifier, display name and memory\nusage. Return a bounded list ordered by descending memory use on the normal\nresource sampling interval. Define consistent unavailable, permission-limited\nand process-exit behavior across Linux, macOS and Windows. Keep total physical\nmemory readings intact.\n\n## Non-goals\n\nProcess CPU sampling (RFC 0005), process termination/control, per-process\nvirtual-memory breakdown, swap attribution, alerts, history/recording, remote\ntelemetry, privileged collection, and UI layout (RFC 0007).\n\n## Design\n\nExtend `monitor-memory`'s sampler to refresh process memory readings using the\nexisting `sysinfo` dependency and return a bounded, normalized process list\nalongside current physical-memory totals. Extend `monitor-core`'s resource\nsnapshot and the CLI `resources` event with process rows. Document the exact\nmemory metric exposed by `sysinfo` on each supported platform; do not combine\nincompatible metrics under one label. Sort descending by bytes, then PID for\nstable ties. Bound the serialized list to the top 20 processes. Exclude\nnon-finite or unavailable values, and use a safe fallback when process names\ncannot be read. Keep the Tauri shell as pass-through and leave presentation to\nRFC 0007.\n\n`Process::memory()` reports resident set size on Linux and macOS (Linux\nresident pages from `/proc`, macOS `pti_resident_size`) and working set size\non Windows (`WorkingSetSize`). The UI labels this value `RSS / WORKING SET`;\nit is physical resident memory, not virtual size or a sum that can be compared\ndirectly with system-wide used memory. `sysinfo` exposes this as an unsigned\nbyte count and uses zero when a platform query fails; omit zero-valued rows so\nan inaccessible process is not shown as a measured zero. The list remains\nbest-effort and unprivileged: inaccessible processes may be absent.\n\n## Acceptance\n\nOn Linux, macOS and Windows, the CLI resource event returns at most 20\nprocesses, each with stable PID, display name and non-negative memory bytes,\nordered by memory descending with deterministic ties. Existing total memory\nfields and resource cadence remain compatible. Permission-denied, warm-up,\nprocess-exit and unavailable readings do not crash sampling or mislabel\nunknown data. Focused sampler/protocol coverage, Rust lint/build and manual\nstream inspection pass. The Memory tab integration is verified under RFC\n0007 after both RFCs are approved."},"source-f34da18b92e4671a-s1":{"body":"来源：`.spec/rfc/0008-per-process-memory-usage.md:1-6`\n\n约束来源图 / Constraint source grap 后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\nOn Linux, macOS and Windows, the CLI resource event returns at most 20\nprocesses, each with stable PID, display name and non-negative memory bytes,\nordered by memory descending with deterministic ties. Existing total memory\nfields and resource cadence remain compatible. Permission-denied, warm-up,\nprocess-exit and unavailable readings do not crash sampling or mislabel\nunknown data. Focused sampler/protocol coverage, Rust lint/build and manual\nstream inspection pass. The Memory tab integration is verified under RFC\n0007 after both RFCs are approved."},"source-9df65130de2a0cb0":{"body":"# .spec/rfc/0009-disktree-ui-parity.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0009: Restore Disktree UI feature parity in Karen (child of 0001)\n\n**Status:** Draft\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n\n## Summary\n\nDefine the complete Disk Tree screen and interaction contract for Karen.app,\nusing the preserved GPUI implementation and Disktree v0.10.1 as references.\nThis RFC closes the detail left open by RFC 0006: Karen must retain the actual\nDisktree workflow and screen structure while rendering it in Vue 3 and Karen's\nluxury steampunk visual language. It covers Explore, Review, Running and Done\nstates, their controls, pointer and keyboard behavior, and acceptance evidence.\n\n## Problem\n\nRFC 0006 correctly requires the source hierarchy, cached tree navigation,\nselection, marks and guarded removal, but describes those requirements at a\nhigh level. That left room for a new dashboard-like layout and incomplete\ninteraction behavior. The current Disk Tree surface still lacks parts of the\nreference workflow and has had treemap tiles overlap or change stacking order\non hover. A visual resemblance alone is not parity: users need the same\nnavigation, scanning, inspection and safe-removal loop.\n\n## Goals\n\n1. Port the user-visible Disk Tree features in pinned upstream Disktree\n   v0.10.1. Use Karen's archived GPUI implementation to understand the Vue\n   migration, not as authority to silently add controls absent upstream.\n2. Preserve RFC 0006's CLI ownership, bounded view payloads, per-session tree\n   cache, absolute-path identity, explicit rescan and removal safeguards.\n3. Preserve Karen's custom title bar, traffic lights and established luxury\n   steampunk palette without changing Disktree's information hierarchy or\n   interaction semantics.\n4. Make tile geometry stable: hover, selection and mark feedback never reorder\n   tiles, promote a tile, alter DOM stacking, or cover neighboring tiles.\n\n## Non-goals\n\n1. Changes to scan accounting, filters' core semantics, caching policy,\n   deletion guards, free-space attribution, or CLI protocol ownership; RFC\n   0006 owns those decisions.\n2. Runtime CPU, memory or other resource-monitor tabs; RFCs 0003, 0007 and\n   0008 own those screens.\n3. New disk-cleaning features absent from the reference, or a new page/card\n   dashboard that replaces the treemap workflow.\n4. Reintroducing Disktree as a separate product, executable or app identity.\n\n## Design\n\n### Reference and ownership\n\nThe product baseline is upstream Disktree tag `v0.10.1`, commit\n`747cb77766b5254827e09782f083bcf42fa07249`. Relevant source: `README.md`,\n`crates/disktree-app/src/views.rs`, `state.rs`, `treemap_view.rs`, and\n`crates/disktree-core/src/treemap.rs` and `removal.rs`. The pinned README is\n[here](https://github.com/tobi/disktree/blob/v0.10.1/README.md). Karen's\n`migration/gpui-reference/` is the porting reference; its extra scan-efficiency\ncontrol and right-click reveal are Karen-specific extensions, absent from this\nupstream version, and are not requirements of this parity RFC. RFC 0006 remains\nauthoritative for scan/cache/protocol and deletion safety. Where this RFC is\nmore specific about screen behavior, it adds requirements to RFC 0006 without\nchanging its core semantics.\n\nCLI/core owns the scan tree, paths, scan progress, marks, selection identity,\nhistory, review plan and removal state. Vue renders bounded snapshots and\nsends user intent through the existing stream protocol. Vue must not duplicate\nfilesystem work, derive destructive plans, or address a tile by its current\narray index. Actions identify absolute paths; visual tree position is only a\nlayout result.\n\n### Explore screen composition\n\nThe Disk Tree tab is a working disk-space explorer, not a landing page. Its\ncontent order is:\n\n1. **Top bar.** Show Karen identity, absolute breadcrumb trail, then\n   back/forward history, Size / Files / Age view choices, Hidden files,\n   Apparent size and depth stepper. Do not add the archived Karen-only\n   scan-efficiency control to claim Disktree parity. Breadcrumbs remain visible at\n   every tree depth. Long trails collapse middle segments while retaining root\n   and current directory. Each in-tree crumb opens that ancestor from the\n   cached tree. Its sibling picker lists sibling directories by selected metric\n   with size/share information and direct-jump behavior. Choosing an ancestor\n   above the current scan root widens the scan root per existing source\n   behavior; it does not reinterpret a relative crumb.\n2. **Totals and legend.** Show scanned bytes, file and directory counts,\n   unreadable-entry count when nonzero, active name filter, and current color\n   legend. Kind mode identifies Code, Agent scratch, Toolchains, Synced, Git,\n   Media, Documents, Cache and Other. Age mode replaces that legend with age\n   buckets. Reclaimable hatching remains independently visible in both modes.\n3. **Treemap work surface.** One canvas-like rendering surface dominates the\n   available width. Squarified tile area represents the selected metric;\n   nesting shows directory structure. Top-level directories have a clear\n   name/header band; deeper labels clip inside their own tile. Depth control\n   sets the number of visible levels. The view panel does not become a grid of\n   independent cards.\n4. **Resizable inspection panel.** Place selection details, Worth a look,\n   marks and current-volume capacity beside the treemap. Drag its left edge to\n   resize; double-click the edge restores default width. At narrow widths,\n   constrain or hide the panel before squeezing the mosaic into unusable tiles.\n5. **Status/key bar.** Keep scan state, current volume and the context-relevant\n   keyboard hints visible without covering the mosaic.\n\nThe toolbar and custom title bar are part of Karen.app. Keep the macOS traffic\nlights. Do not restore a native/default title bar or browser-native select.\n\n### Treemap appearance and behavior\n\nThe mosaic is a single stable layout. Each tile has a fixed rectangle and\npaint order for a given tree, metric, depth and viewport. Category determines\nhue; nesting depth adjusts fill lightness. Age mode uses recency colors.\nReclaimable content gets a hatch overlay independent of hue. Filter matches\nretain full color; non-matching tiles recede while ancestor tiles remain\nreadable. Unreadable entries have a warning marker. Marked paths use the marked\nfill/border and marked descendants show that they are covered by the parent.\n\nSelection uses an outline. Hover uses a separate outline and a pointer-following\ntooltip containing name, size, category and reclaimability when applicable.\nTooltip stays within the window and never changes tile geometry. Hover and\nselection must not change z-order, DOM order, paint order, or tile position;\nthere is no “bring hovered node to front” behavior. These rules are explicit\nregressions guards because overlapping tiles make sizes and labels unreadable.\n\nFiltering is incremental by name. While editing, only matching tiles keep full\ncolor and their containing directories remain subdued. Enter applies the\nfiltered result; Escape clears the filter before it performs any other Explore\naction. Rescanning is explicit except when the user changes scan options such\nas Hidden files or Apparent size, which restart the current scan as in the\nsource.\n\n### Selection panel contents\n\nWith a tile selected, show its absolute/relative path, name, size, share of the\nscan root, files, last write, kind, reclaimability reason and unreadable/mark\ncoverage state when known. Show Git working-tree details for recognized Git\ncheckouts when available. “Worth a look” lists a bounded set of large or\nreclaimable candidates with reason and relative-size bars; choosing one selects\nand reveals that path in the treemap. Marks section shows marked paths, nested\nor covered counts, sizes, remove controls, and an affordance to open Review.\nVolume section shows device/mount identity, used/free/total values, projected\nspace after eligible marks, and the volume-switch affordance. Projection must\nfollow RFC 0006 attribution; a mark on another mounted volume must not inflate\nthe current volume's projected free space.\n\n### Pointer and keyboard contract\n\nAll controls must return focus to the treemap after activation unless a dialog,\nmenu or text filter explicitly owns input. When a menu is open, its arrows,\nEnter and Escape are consumed by that menu; the underlying tree must not act.\nThe action target is the tile under the pointer if the pointer moved most\nrecently, otherwise the keyboard selection. Keyboard actions that operate on a\ntile adopt that pointer target as the selection first.\n\n| Input | Required behavior |\n| --- | --- |\n| Click tile | Select tile; clicking the already selected directory opens it. |\n| Double-click tile | Select and open directory. |\n| Ctrl/Cmd-click or middle-click | Toggle mark without moving selection. |\n| Right-click tile | No Disk Tree action is defined by upstream v0.10.1. Do not add one as part of parity. |\n| Hover tile | Show tooltip and hover outline only; never reorder or raise tile. |\n| Enter | Open selected/pointed directory at any depth. |\n| Space or `x` | Toggle mark on selected/pointed tile. |\n| Arrow keys or `h/j/k/l` | Move selection geometrically among tiles at current level; at an edge, move to parent. |\n| Tab / Shift-Tab | Move to next / previous sibling. |\n| Backspace or `u` | Go to parent directory. |\n| Escape | Clear active filter first; otherwise clear selection or go up one level. |\n| Scroll | Zoom toward pointer; at the source-defined threshold, descend into directory under pointer. Reverse zoom walks back out. |\n| Shift-scroll | Pan the magnified view. |\n| `-`, `=`, `+`, `0` | Shrink, magnify, or reset treemap view. |\n| `[` / `]` | Show fewer / more tree levels. |\n| Cmd/Ctrl `+`, `-`, `0` | Change interface zoom, not treemap zoom. |\n| Alt-Left/Right; Cmd-[ / Cmd-] on macOS; mouse side buttons | Navigate Explore history back / forward. |\n| `/` or `s` | Open incremental name filter. |\n| `t` | Cycle Size, Files and Age display modes. |\n| `d` / `i` | Toggle Apparent size / Hidden files and rescan current root. |\n| `r` | Explicitly rescan current root. |\n| `v` | Open custom volume picker; choose a volume and use cached tree if available. |\n| Cmd/Ctrl-O | Choose a directory to scan. |\n| `g` | Widen to whole disk; clicking an ancestor crumb above scan root also widens. |\n| `p` | Toggle selection/status line. |\n| `o` | Reveal action target in system file manager. |\n| `c` | Open Review when at least one path is marked. |\n| `?` | Open keyboard help overlay. |\n| `q` | Quit app, subject to platform menu conventions. |\n\nThe help overlay must document actual bindings and platform modifiers, not a\nsecond invented keymap. The volume picker and breadcrumb sibling picker are\ncustom themed popovers/dialogs with visible keyboard highlight, path and device\ndetails; they must not use native HTML `\u003cselect>` controls.\n\n### Review, removal and completion\n\nReview is a separate full-screen state, not a panel hidden below the mosaic.\nList every marked path with size and full path, including nested/covered and\nblocked status; if presentation has a display cap, state the omitted count and\nkeep the actual plan complete. Explain Trash versus permanent deletion and\nwhich backends are available. Show marked bytes, actionable bytes, nested and\nblocked counts, and projected free space on the measured volume. A blocked\nentry must include its reason. Provide Back, clear marks, save path list, copy\nagent prompt, removal-mode selection, and commit controls.\n\nTrash is the reversible default when supported. Permanent deletion always\nopens explicit confirmation naming affected paths and total bytes. Marking is\nnever destructive. During removal, show progress and allow Escape to stop after\nthe current item where the core supports it. Done state reports actual\ncompleted/failed items and measured free-space change, then returns to Explore\nwith a refreshed tree. Existing removal guards remain enforced in CLI/core;\nthe renderer cannot bypass them.\n\n### Layout and implementation constraints\n\nPort the source hierarchy and behavior into the existing Vue Disk Tree surface\nand CLI stream events. Keep tile painting in one canvas/SVG rendering layer or\nequivalent stable renderer; do not create independently reordered tile cards.\nIf SVG is used, render sibling rectangles in deterministic layout order and\nrender hover/selection feedback as non-layout overlays that do not participate\nin hit testing. Tooltip is a separate overlay and is the only element allowed\nto float above the mosaic. Clip labels to each tile. Never use z-index changes\nto fix hover, selection or overlap.\n\nDo not add a second tree model in Vue. Keep absolute paths as action identity,\nbound the data sent to Vue, and reuse completed in-session volume trees per RFC\n0006. Switching to a cached volume, following a breadcrumb, descending,\nascending or choosing a sibling must not issue a scan. Explicit rescan replaces\nonly that volume cache after success; failed/cancelled rescans preserve its\nlast completed tree.\n\n## Acceptance\n\n1. **Feature inventory:** Explore, Review, Running and Done states contain all\n   controls and information named in this RFC; compare each screen against the\n   archived GPUI screenshot and source. The UI retains Disktree's treemap-first\n   hierarchy and Karen's custom title bar/traffic lights.\n2. **No tile overlap/order drift:** At normal, large and narrow window sizes,\n   labels stay clipped to their own tiles and layout rectangles do not overlap\n   because of hover/selection. Repeated hover over small and large tiles never\n   changes sibling order, paint order, geometry or z-index. Tooltip remains\n   readable and inside the window.\n3. **Navigation:** Click, repeat-click, double-click, Enter, arrows, Tab,\n   breadcrumb navigation, sibling jumps, history, volume switch and ancestor\n   widening all target the same absolute paths as the source behavior.\n   Cached navigation and cached volume revisit issue no scan request.\n4. **View controls:** Size/Files/Age, Hidden files, Apparent size, depth,\n   filter, wheel zoom/descend, reverse zoom, pan and interface zoom show correct\n   state and do not steal tree focus after activation.\n5. **Pointer and marks:** Hover only changes outline/tooltip. Modifier-click\n   marks without changing selection. Keyboard mark/open actions use the\n   pointer target when pointer moved last and otherwise the selected tile.\n6. **Safe review:** Marking changes no files. Review shows full paths and\n   accurate bytes, nested/blocked state and volume-attributed projection.\n   Trash/permanent choices, permanent confirmation, cancel, save-list,\n   copy-prompt, progress, interruption and Done state preserve core guards.\n7. **Protocol and ownership:** Vue receives bounded snapshots; CLI/core remains\n   authority for tree, marks, review plan, removal and cache. All tile actions\n   use absolute paths, not layout indexes.\n8. **Evidence:** Run relevant CLI/protocol and desktop checks already defined by\n   RFC 0006, then manually inspect the live Karen.app at normal and large\n   window sizes. Attach screenshots covering root mosaic, nested directory,\n   hover tooltip, side panel, sibling picker and Review. Run `specify validate`\n   and `specify sync-check` after implementation."},"source-9df65130de2a0cb0-s1":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0009: Restore Disktree UI feature parity in Karen (child of 0001)\n\n**Status:** Draft\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n"},"source-9df65130de2a0cb0-s2":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:7-15`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nDefine the complete Disk Tree screen and interaction contract for Karen.app,\nusing the preserved GPUI implementation and Disktree v0.10.1 as references.\nThis RFC closes the detail left open by RFC 0006: Karen must retain the actual\nDisktree workflow and screen structure while rendering it in Vue 3 and Karen's\nluxury steampunk visual language. It covers Explore, Review, Running and Done\nstates, their controls, pointer and keyboard behavior, and acceptance evidence.\n"},"source-9df65130de2a0cb0-s3":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:16-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nRFC 0006 correctly requires the source hierarchy, cached tree navigation,\nselection, marks and guarded removal, but describes those requirements at a\nhigh level. That left room for a new dashboard-like layout and incomplete\ninteraction behavior. The current Disk Tree surface still lacks parts of the\nreference workflow and has had treemap tiles overlap or change stacking order\non hover. A visual resemblance alone is not parity: users need the same\nnavigation, scanning, inspection and safe-removal loop.\n"},"source-9df65130de2a0cb0-s4":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:26-38`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\n1. Port the user-visible Disk Tree features in pinned upstream Disktree\n   v0.10.1. Use Karen's archived GPUI implementation to understand the Vue\n   migration, not as authority to silently add controls absent upstream.\n2. Preserve RFC 0006's CLI ownership, bounded view payloads, per-session tree\n   cache, absolute-path identity, explicit rescan and removal safeguards.\n3. Preserve Karen's custom title bar, traffic lights and established luxury\n   steampunk palette without changing Disktree's information hierarchy or\n   interaction semantics.\n4. Make tile geometry stable: hover, selection and mark feedback never reorder\n   tiles, promote a tile, alter DOM stacking, or cover neighboring tiles.\n"},"source-9df65130de2a0cb0-s5":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:39-49`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Non-goals\n\n1. Changes to scan accounting, filters' core semantics, caching policy,\n   deletion guards, free-space attribution, or CLI protocol ownership; RFC\n   0006 owns those decisions.\n2. Runtime CPU, memory or other resource-monitor tabs; RFCs 0003, 0007 and\n   0008 own those screens.\n3. New disk-cleaning features absent from the reference, or a new page/card\n   dashboard that replaces the treemap workflow.\n4. Reintroducing Disktree as a separate product, executable or app identity.\n"},"source-9df65130de2a0cb0-s6":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:50-51`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design\n"},"source-9df65130de2a0cb0-s7":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:52-72`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Reference and ownership\n\nThe product baseline is upstream Disktree tag `v0.10.1`, commit\n`747cb77766b5254827e09782f083bcf42fa07249`. Relevant source: `README.md`,\n`crates/disktree-app/src/views.rs`, `state.rs`, `treemap_view.rs`, and\n`crates/disktree-core/src/treemap.rs` and `removal.rs`. The pinned README is\n[here](https://github.com/tobi/disktree/blob/v0.10.1/README.md). Karen's\n`migration/gpui-reference/` is the porting reference; its extra scan-efficiency\ncontrol and right-click reveal are Karen-specific extensions, absent from this\nupstream version, and are not requirements of this parity RFC. RFC 0006 remains\nauthoritative for scan/cache/protocol and deletion safety. Where this RFC is\nmore specific about screen behavior, it adds requirements to RFC 0006 without\nchanging its core semantics.\n\nCLI/core owns the scan tree, paths, scan progress, marks, selection identity,\nhistory, review plan and removal state. Vue renders bounded snapshots and\nsends user intent through the existing stream protocol. Vue must not duplicate\nfilesystem work, derive destructive plans, or address a tile by its current\narray index. Actions identify absolute paths; visual tree position is only a\nlayout result.\n"},"source-9df65130de2a0cb0-s8":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:73-108`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Explore screen composition\n\nThe Disk Tree tab is a working disk-space explorer, not a landing page. Its\ncontent order is:\n\n1. **Top bar.** Show Karen identity, absolute breadcrumb trail, then\n   back/forward history, Size / Files / Age view choices, Hidden files,\n   Apparent size and depth stepper. Do not add the archived Karen-only\n   scan-efficiency control to claim Disktree parity. Breadcrumbs remain visible at\n   every tree depth. Long trails collapse middle segments while retaining root\n   and current directory. Each in-tree crumb opens that ancestor from the\n   cached tree. Its sibling picker lists sibling directories by selected metric\n   with size/share information and direct-jump behavior. Choosing an ancestor\n   above the current scan root widens the scan root per existing source\n   behavior; it does not reinterpret a relative crumb.\n2. **Totals and legend.** Show scanned bytes, file and directory counts,\n   unreadable-entry count when nonzero, active name filter, and current color\n   legend. Kind mode identifies Code, Agent scratch, Toolchains, Synced, Git,\n   Media, Documents, Cache and Other. Age mode replaces that legend with age\n   buckets. Reclaimable hatching remains independently visible in both modes.\n3. **Treemap work surface.** One canvas-like rendering surface dominates the\n   available width. Squarified tile area represents the selected metric;\n   nesting shows directory structure. Top-level directories have a clear\n   name/header band; deeper labels clip inside their own tile. Depth control\n   sets the number of visible levels. The view panel does not become a grid of\n   independent cards.\n4. **Resizable inspection panel.** Place selection details, Worth a look,\n   marks and current-volume capacity beside the treemap. Drag its left edge to\n   resize; double-click the edge restores default width. At narrow widths,\n   constrain or hide the panel before squeezing the mosaic into unusable tiles.\n5. **Status/key bar.** Keep scan state, current volume and the context-relevant\n   keyboard hints visible without covering the mosaic.\n\nThe toolbar and custom title bar are part of Karen.app. Keep the macOS traffic\nlights. Do not restore a native/default title bar or browser-native select.\n"},"source-9df65130de2a0cb0-s9":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:109-132`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Treemap appearance and behavior\n\nThe mosaic is a single stable layout. Each tile has a fixed rectangle and\npaint order for a given tree, metric, depth and viewport. Category determines\nhue; nesting depth adjusts fill lightness. Age mode uses recency colors.\nReclaimable content gets a hatch overlay independent of hue. Filter matches\nretain full color; non-matching tiles recede while ancestor tiles remain\nreadable. Unreadable entries have a warning marker. Marked paths use the marked\nfill/border and marked descendants show that they are covered by the parent.\n\nSelection uses an outline. Hover uses a separate outline and a pointer-following\ntooltip containing name, size, category and reclaimability when applicable.\nTooltip stays within the window and never changes tile geometry. Hover and\nselection must not change z-order, DOM order, paint order, or tile position;\nthere is no “bring hovered node to front” behavior. These rules are explicit\nregressions guards because overlapping tiles make sizes and labels unreadable.\n\nFiltering is incremental by name. While editing, only matching tiles keep full\ncolor and their containing directories remain subdued. Enter applies the\nfiltered result; Escape clears the filter before it performs any other Explore\naction. Rescanning is explicit except when the user changes scan options such\nas Hidden files or Apparent size, which restart the current scan as in the\nsource.\n"},"source-9df65130de2a0cb0-s10":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:133-146`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Selection panel contents\n\nWith a tile selected, show its absolute/relative path, name, size, share of the\nscan root, files, last write, kind, reclaimability reason and unreadable/mark\ncoverage state when known. Show Git working-tree details for recognized Git\ncheckouts when available. “Worth a look” lists a bounded set of large or\nreclaimable candidates with reason and relative-size bars; choosing one selects\nand reveals that path in the treemap. Marks section shows marked paths, nested\nor covered counts, sizes, remove controls, and an affordance to open Review.\nVolume section shows device/mount identity, used/free/total values, projected\nspace after eligible marks, and the volume-switch affordance. Projection must\nfollow RFC 0006 attribution; a mark on another mounted volume must not inflate\nthe current volume's projected free space.\n"},"source-9df65130de2a0cb0-s11":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:147-192`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Pointer and keyboard contract\n\nAll controls must return focus to the treemap after activation unless a dialog,\nmenu or text filter explicitly owns input. When a menu is open, its arrows,\nEnter and Escape are consumed by that menu; the underlying tree must not act.\nThe action target is the tile under the pointer if the pointer moved most\nrecently, otherwise the keyboard selection. Keyboard actions that operate on a\ntile adopt that pointer target as the selection first.\n\n| Input | Required behavior |\n| --- | --- |\n| Click tile | Select tile; clicking the already selected directory opens it. |\n| Double-click tile | Select and open directory. |\n| Ctrl/Cmd-click or middle-click | Toggle mark without moving selection. |\n| Right-click tile | No Disk Tree action is defined by upstream v0.10.1. Do not add one as part of parity. |\n| Hover tile | Show tooltip and hover outline only; never reorder or raise tile. |\n| Enter | Open selected/pointed directory at any depth. |\n| Space or `x` | Toggle mark on selected/pointed tile. |\n| Arrow keys or `h/j/k/l` | Move selection geometrically among tiles at current level; at an edge, move to parent. |\n| Tab / Shift-Tab | Move to next / previous sibling. |\n| Backspace or `u` | Go to parent directory. |\n| Escape | Clear active filter first; otherwise clear selection or go up one level. |\n| Scroll | Zoom toward pointer; at the source-defined threshold, descend into directory under pointer. Reverse zoom walks back out. |\n| Shift-scroll | Pan the magnified view. |\n| `-`, `=`, `+`, `0` | Shrink, magnify, or reset treemap view. |\n| `[` / `]` | Show fewer / more tree levels. |\n| Cmd/Ctrl `+`, `-`, `0` | Change interface zoom, not treemap zoom. |\n| Alt-Left/Right; Cmd-[ / Cmd-] on macOS; mouse side buttons | Navigate Explore history back / forward. |\n| `/` or `s` | Open incremental name filter. |\n| `t` | Cycle Size, Files and Age display modes. |\n| `d` / `i` | Toggle Apparent size / Hidden files and rescan current root. |\n| `r` | Explicitly rescan current root. |\n| `v` | Open custom volume picker; choose a volume and use cached tree if available. |\n| Cmd/Ctrl-O | Choose a directory to scan. |\n| `g` | Widen to whole disk; clicking an ancestor crumb above scan root also widens. |\n| `p` | Toggle selection/status line. |\n| `o` | Reveal action target in system file manager. |\n| `c` | Open Review when at least one path is marked. |\n| `?` | Open keyboard help overlay. |\n| `q` | Quit app, subject to platform menu conventions. |\n\nThe help overlay must document actual bindings and platform modifiers, not a\nsecond invented keymap. The volume picker and breadcrumb sibling picker are\ncustom themed popovers/dialogs with visible keyboard highlight, path and device\ndetails; they must not use native HTML `\u003cselect>` controls.\n"},"source-9df65130de2a0cb0-s12":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:193-211`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Review, removal and completion\n\nReview is a separate full-screen state, not a panel hidden below the mosaic.\nList every marked path with size and full path, including nested/covered and\nblocked status; if presentation has a display cap, state the omitted count and\nkeep the actual plan complete. Explain Trash versus permanent deletion and\nwhich backends are available. Show marked bytes, actionable bytes, nested and\nblocked counts, and projected free space on the measured volume. A blocked\nentry must include its reason. Provide Back, clear marks, save path list, copy\nagent prompt, removal-mode selection, and commit controls.\n\nTrash is the reversible default when supported. Permanent deletion always\nopens explicit confirmation naming affected paths and total bytes. Marking is\nnever destructive. During removal, show progress and allow Escape to stop after\nthe current item where the core supports it. Done state reports actual\ncompleted/failed items and measured free-space change, then returns to Explore\nwith a refreshed tree. Existing removal guards remain enforced in CLI/core;\nthe renderer cannot bypass them.\n"},"source-9df65130de2a0cb0-s13":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:212-229`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Layout and implementation constraints\n\nPort the source hierarchy and behavior into the existing Vue Disk Tree surface\nand CLI stream events. Keep tile painting in one canvas/SVG rendering layer or\nequivalent stable renderer; do not create independently reordered tile cards.\nIf SVG is used, render sibling rectangles in deterministic layout order and\nrender hover/selection feedback as non-layout overlays that do not participate\nin hit testing. Tooltip is a separate overlay and is the only element allowed\nto float above the mosaic. Clip labels to each tile. Never use z-index changes\nto fix hover, selection or overlap.\n\nDo not add a second tree model in Vue. Keep absolute paths as action identity,\nbound the data sent to Vue, and reuse completed in-session volume trees per RFC\n0006. Switching to a cached volume, following a breadcrumb, descending,\nascending or choosing a sibling must not issue a scan. Explicit rescan replaces\nonly that volume cache after success; failed/cancelled rescans preserve its\nlast completed tree.\n"},"source-9df65130de2a0cb0-s14":{"body":"来源：`.spec/rfc/0009-disktree-ui-parity.md:230-262`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\n1. **Feature inventory:** Explore, Review, Running and Done states contain all\n   controls and information named in this RFC; compare each screen against the\n   archived GPUI screenshot and source. The UI retains Disktree's treemap-first\n   hierarchy and Karen's custom title bar/traffic lights.\n2. **No tile overlap/order drift:** At normal, large and narrow window sizes,\n   labels stay clipped to their own tiles and layout rectangles do not overlap\n   because of hover/selection. Repeated hover over small and large tiles never\n   changes sibling order, paint order, geometry or z-index. Tooltip remains\n   readable and inside the window.\n3. **Navigation:** Click, repeat-click, double-click, Enter, arrows, Tab,\n   breadcrumb navigation, sibling jumps, history, volume switch and ancestor\n   widening all target the same absolute paths as the source behavior.\n   Cached navigation and cached volume revisit issue no scan request.\n4. **View controls:** Size/Files/Age, Hidden files, Apparent size, depth,\n   filter, wheel zoom/descend, reverse zoom, pan and interface zoom show correct\n   state and do not steal tree focus after activation.\n5. **Pointer and marks:** Hover only changes outline/tooltip. Modifier-click\n   marks without changing selection. Keyboard mark/open actions use the\n   pointer target when pointer moved last and otherwise the selected tile.\n6. **Safe review:** Marking changes no files. Review shows full paths and\n   accurate bytes, nested/blocked state and volume-attributed projection.\n   Trash/permanent choices, permanent confirmation, cancel, save-list,\n   copy-prompt, progress, interruption and Done state preserve core guards.\n7. **Protocol and ownership:** Vue receives bounded snapshots; CLI/core remains\n   authority for tree, marks, review plan, removal and cache. All tile actions\n   use absolute paths, not layout indexes.\n8. **Evidence:** Run relevant CLI/protocol and desktop checks already defined by\n   RFC 0006, then manually inspect the live Karen.app at normal and large\n   window sizes. Attach screenshots covering root mosaic, nested directory,\n   hover tooltip, side panel, sibling picker and Review. Run `specify validate`\n   and `specify sync-check` after implementation."},"source-b335630551682c19":{"body":"# README.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/rfc/0009-disktree-ui-parity.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Karen\n\n![Karen desktop app: the Runtime console with live CPU, memory and mounted-volume instruments](assets/screenshot.png)\n\nKaren is a cross-platform system monitor and disk-space explorer. Runtime\nshows live CPU, physical memory and mounted-volume usage. CPU and Memory tabs\nshow per-process usage. Disk Tree maps allocated file space and provides a\nreview-before-removal workflow.\n\n## Desktop\n\nRequires Rust 1.97+, Node.js 22+, and pnpm 10+.\n\n```sh\npnpm install\npnpm dev\n```\n\nRuntime opens first and does not scan files. Open **Disk Tree** to choose a\nvolume and start its first scan. Cached tree navigation does not rescan.\nMarking a path is non-destructive. Review marks and confirm before moving\nitems to Trash or deleting permanently.\n\nBuild release bundles with:\n\n```sh\npnpm tauri\n```\n\nTauri bundles the Vue interface and the matching-platform `karen` CLI sidecar.\nRust outputs, including desktop bundles and sidecar staging, live under the\nroot `target/` directory.\n\n## CLI\n\nBuild and run standalone CLI:\n\n```sh\ncargo build --release -p karen-cli\ntarget/release/karen --help\ntarget/release/karen /path/to/scan\n```\n\n`karen --stream-json` starts the versioned JSON-lines interface used by the\ndesktop app. It accepts requests on stdin, emits events on stdout and keeps\ndiagnostics on stderr. CLI owns scan state, telemetry, tree navigation, marks,\nreview and guarded removal. Tauri only manages the window and scoped sidecar.\n\n## Checks\n\n```sh\ncargo xtask lint\ncargo xtask test\npnpm --dir apps/desktop build\n```\n\nLinux desktop builds need Tauri's WebKitGTK 4.1 and GTK development libraries.\nSee [Tauri prerequisites](https://v2.tauri.app/start/prerequisites/).\n\n## Project structure\n\n- `apps/cli/` — standalone CLI and JSON-lines protocol\n- `apps/desktop/` — Tauri 2, Vue 3 and custom window chrome\n- `crates/monitor-core/` — CLI-owned resource and disk state\n- `crates/monitor-cpu/` — CPU sampling\n- `crates/monitor-memory/` — memory sampling\n- `crates/monitor-disk/` — scan, treemap, space and removal safety\n- `.agents/skills/karen-design/` — interface design rules and review checklist\n- `.impeccable/` — project visual reference\n\nRFCs live in `.spec/`. Use the Specify skill CLI for status changes and\narchiving; run `sync-check` after updates."},"source-b335630551682c19-s1":{"body":"来源：`README.md:1-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Karen\n\n![Karen desktop app: the Runtime console with live CPU, memory and mounted-volume instruments](assets/screenshot.png)\n\nKaren is a cross-platform system monitor and disk-space explorer. Runtime\nshows live CPU, physical memory and mounted-volume usage. CPU and Memory tabs\nshow per-process usage. Disk Tree maps allocated file space and provides a\nr
