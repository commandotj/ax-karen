语义核验，不代表代码有误。"},"folder:skill:.agents/skills/karen-design":{"body":"# .agents/skills/karen-design\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-e4ec717cb89bde6c":{"body":"# .agents/skills/karen-design/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: karen-design\ndescription: Design, implement, or review Karen desktop resource-monitor interfaces. Use when changing Runtime, CPU, Memory, Disk Tree, app chrome, or visual styling in this repository.\n---\n\n# Karen interface design\n\nDesign Karen as a luxurious steampunk system monitor: a desktop instrument, not\na website, marketing page, or generic dashboard. Preserve the user's request\nfor ornate visual richness. Do not simplify it into flat cards, whitespace, or\na table-led layout.\n\n## Before changing UI\n\n1. Read `apps/desktop/PRODUCT.md` and the relevant RFCs in `.spec/rfc/`.\n2. Treat RFC status as a hard boundary. Draft RFCs are design context, not\n   implementation approval. Follow the repository's RFC approval workflow\n   before implementing RFC-scoped behavior.\n3. Use `assets/screenshot.png` as the visual reference for Disk Tree\n   structure and information hierarchy. Match its workflow and composition;\n   apply Karen's luxurious brass, copper, enamel, engraving, and restrained\n   instrument glow.\n4. Preserve `.impeccable/` at repository root. Use its design notes when\n   present; do not move or replace that directory.\n5. Keep the Tauri window a shell around the `karen --stream-json` CLI. The CLI\n   owns measurements, scans, tree state, and filesystem actions. Vue renders\n   CLI events and sends user actions through the existing protocol.\n\n## Information architecture\n\nUse a custom title bar and keep macOS traffic lights visible. Do not restore\nthe operating-system default title bar. Make the app open on **Runtime**.\n\nUse focused tabs:\n\n- **Runtime**: visual overview of every supported resource on one instrument\n  console: system CPU, physical memory, and every mounted volume. Show live\n  state, exact readings, capacity or utilization, and concise process-use\n  summaries where data exists. Use gauges, traces, engraved scales, segmented\n  meters, indicators, and compact numeric readouts. Graphics lead; a plain\n  ledger or cards must not dominate.\n- **CPU**: detailed, bounded per-process CPU usage, with stable process\n  identity, clear units, sorting, and explicit unavailable states.\n- **Memory**: physical-memory totals and detailed, bounded per-process memory\n  usage, with metric labels matching the CLI's platform-specific meaning.\n- **Disk Tree**: the complete disk space-finding work surface. Do not add a\n  separate Volumes tab. Clicking a Runtime volume instrument opens Disk Tree\n  for that volume.\n\nDo not start a filesystem scan on launch or when switching between Runtime,\nCPU, and Memory. Scan only after entering Disk Tree or explicitly requesting a\nrescan.\n\n## Disk Tree reference contract\n\nPreserve the source screen hierarchy shown in `assets/screenshot.png`:\n\n1. Top controls and absolute breadcrumb trail, including direct breadcrumb\n   navigation and sibling jumps.\n2. Scan totals, filters, and category legend above the treemap.\n3. Large treemap as the main work surface, retaining proportions, labels, and\n   selection behavior.\n4. Side panel for selection details, marks, review entry, and volume space.\n5. Keyboard help and scan status along the bottom.\n\nPreserve the full workflow: volume selection, cached tree navigation, click to\ndescend, breadcrumb return, sibling navigation, selection, mark/unmark,\nreview, guarded removal confirmation, and explicit rescan. Navigation within\na completed scan uses the cached tree. Never make a volume click discard the\nvisible tree or silently trigger a fresh scan. Keep paths absolute when\nresolving tiles, breadcrumbs, and marks. Keep deletion safeguards owned by the\nCLI/core.\n\n## Visual language\n\n- Build an instrument console with layered dark enamel, substantial brass and\n  copper framing, engraved dividers and scales, rivets or fine corner\n  ornament, selective highlights, and restrained status illumination.\n- Give each resource a distinct, legible instrument. Ornament must reinforce\n  reading and interaction, never obscure values or consume the treemap.\n- Maintain dense information hierarchy suitable for continuous monitoring.\n  Use stable alignment, readable labels, and explicit units; do not make users\n  infer whether values are percentages, bytes, rates, or totals.\n- Use custom-designed controls and dropdowns that match the console. Avoid\n  browser-default select menus, unstyled native popovers, and platform-default\n  chrome. Preserve the traffic lights.\n- Keep pointer interaction as the default desktop cursor. Use text cursors only\n  inside actual text-entry controls.\n- Make tabs, instruments, treemap tiles, breadcrumbs, and review actions\n  keyboard accessible with visible focus and meaningful accessible names.\n- Handle empty, loading, stale, permission-limited, and unavailable telemetry\n  as explicit states. Never fabricate readings or imply a scan completed when\n  it did not.\n\n## Review checklist\n\nBefore presenting a UI change, check:\n\n- Does Runtime visualize CPU, physical memory, and all mounted volumes\n  together, with exact readings and applicable process summaries?\n- Do CPU and Memory detail views show per-process usage rather than only\n  machine totals?\n- Does each Runtime disk instrument jump to the matching Disk Tree volume?\n- Does Disk Tree retain the source hierarchy and cached navigation behavior?\n- Does launch avoid scanning disks until Disk Tree is opened?\n- Are custom chrome, traffic lights, ornate steampunk treatment, readability,\n  and keyboard paths intact?\n- Are Draft RFC requirements kept separate from approved implementation scope?\n\nInspect the rendered app at practical window sizes when visual tooling is\navailable. Report what was inspected and what remains unverified; a build or\nstatic check alone does not establish visual correctness.\n\n## Authority\n\nRepository product definition and RFCs are authoritative for behavior. This\nskill defines the standing visual and interaction direction; it does not\noverride RFC approval, CLI ownership, or disk safety invariants."},"source-e4ec717cb89bde6c-s1":{"body":"来源：`.agents/skills/karen-design/SKILL.md:6-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Karen interface design\n\nDesign Karen as a luxurious steampunk system monitor: a desktop instrument, not\na website, marketing page, or generic dashboard. Preserve the user's request\nfor ornate visual richness. Do not simplify it into flat cards, whitespace, or\na table-led layout.\n"},"source-e4ec717cb89bde6c-s2":{"body":"来源：`.agents/skills/karen-design/SKILL.md:13-28`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Before changing UI\n\n1. Read `apps/desktop/PRODUCT.md` and the relevant RFCs in `.spec/rfc/`.\n2. Treat RFC status as a hard boundary. Draft RFCs are design context, not\n   implementation approval. Follow the repository's RFC approval workflow\n   before implementing RFC-scoped behavior.\n3. Use `assets/screenshot.png` as the visual reference for Disk Tree\n   structure and information hierarchy. Match its workflow and composition;\n   apply Karen's luxurious brass, copper, enamel, engraving, and restrained\n   instrument glow.\n4. Preserve `.impeccable/` at repository root. Use its design notes when\n   present; do not move or replace that directory.\n5. Keep the Tauri window a shell around the `karen --stream-json` CLI. The CLI\n   owns measurem avigation and sibling jumps.\n2. Scan totals, filters, and category legend above the treemap.\n3. Large treemap as the main work surface, retaining proportions, labels, and\n   selection behavior.\n4. Side panel for selection details, marks, review entry, and volume space.\n5. Keyboard help and scan status along the bottom.\n\nPreserve the full workflow: volume selection, cached tree navigation, click to\ndescend, breadcrumb return, sibling navigation, selection, mark/unmark,\nreview, guarded removal confirmation, and explicit rescan. Navigation within\na completed scan uses the cached tree. Never make a volume click discard the\nvisible tree or silently trigger a fresh scan. Keep paths absolute when\nresolving tiles, breadcrumbs, and marks. Keep deletion safeguards owned by the\nCLI/core.\n"},"source-e4ec717cb89bde6c-s5":{"body":"来源：`.agents/skills/karen-design/SKILL.md:74-94`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Visual language\n\n- Build an instrument console with layered dark enamel, substantial brass and\n  copper framing, engraved dividers and scales, rivets or fine corner\n  ornament, selective highlights, and restrained status illumination.\n- Give each resource a distinct, legible instrument. Ornament must reinforce\n  reading and interaction, never obscure values or consume the treemap.\n- Maintain dense information hierarchy suitable for continuous monitoring.\n  Use stable alignment, readable labels, and explicit units; do not make users\n  infer whether values are percentages, bytes, rates, or totals.\n- Use custom-designed controls and dropdowns that match the console. Avoid\n  browser-default select menus, unstyled native popovers, and platform-default\n  chrome. Preserve the traffic lights.\n- Keep pointer interaction as the default desktop cursor. Use text cursors only\n  inside actual text-entry controls.\n- Make tabs, instruments, treemap tiles, breadcrumbs, and review actions\n  keyboard accessible with visible focus and meaningful accessible names.\n- Handle empty, loading, stale, permission-limited, and unavailable telemetry\n  as explicit states. Never fabricate readings or imply a scan completed when\n  it did not.\n"},"source-e4ec717cb89bde6c-s6":{"body":"来源：`.agents/skills/karen-design/SKILL.md:95-113`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Review checklist\n\nBefore presenting a UI change, check:\n\n- Does Runtime visualize CPU, physical memory, and all mounted volumes\n  together, with exact readings and applicable process summaries?\n- Do CPU and Memory detail views show per-process usage rather than only\n  machine totals?\n- Does each Runtime disk instrument jump to the matching Disk Tree volume?\n- Does Disk Tree retain the source hierarchy and cached navigation behavior?\n- Does launch avoid scanning disks until Disk Tree is opened?\n- Are custom chrome, traffic lights, ornate steampunk treatment, readability,\n  and keyboard paths intact?\n- Are Draft RFC requirements kept separate from approved implementation scope?\n\nInspect the rendered app at practical window sizes when visual tooling is\navailable. Report what was inspected and what remains unverified; a build or\nstatic check alone does not establish visual correctness.\n"},"source-e4ec717cb89bde6c-s7":{"body":"来源：`.agents/skills/karen-design/SKILL.md:114-118`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Authority\n\nRepository product definition and RFCs are authoritative for behavior. This\nskill defines the standing visual and interaction direction; it does not\noverride RFC approval, CLI ownership, or disk safety invariants."},"source-a54ff182c7e8acf5":{"body":"# AGENTS.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Karen — agent guide\n\nKaren is a Rust CLI system monitor with a Tauri 2 + Vue 3 desktop shell. The\nCLI owns scanning, telemetry, tree state, marks, review and removal. The desktop\nforwards JSON lines and renders bounded data. Do not add a second backend in\nVue or Tauri.\n\n## Product layout\n\n| path | responsibility |\n| --- | --- |\n| `apps/cli/` | standalone CLI and `--stream-json` protocol |\n| `apps/desktop/src-tauri/` | Tauri window and scoped CLI sidecar |\n| `apps/desktop/src/` | Vue views, custom window chrome and Canvas treemap |\n| `crates/monitor-core/` | CLI-owned application state and orchestration |\n| `crates/monitor-cpu/` | read-only CPU sampling |\n| `crates/monitor-memory/` | read-only memory sampling |\n| `crates/monitor-disk/` | scan, tree, layout, space and guarded removal |\n| `.agents/skills/karen-design/` | product design constraints and visual review |\n| `.impeccable/` | project design reference; keep at repository root |\n| `scripts/` | repo-root task scripts: sidecar build, scan benchmarks, mount tests |\n| `migration/gpui-reference/` | archived pre-migration GPUI sources; reference only, not compiled |\n\nMonorepo conventions: task orchestration lives at the repository root —\nroot `package.json`, `scripts/` and `xtask/`. Workspace packages declare\nonly minimal lifecycle scripts (`dev`, `build`); do not add per-package\n`scripts/` folders or separate task runners. All Rust and frontend build\noutput is unified under the root `target/`; sidecars stage at\n`target/tauri-sidecars/` and generated Tauri schemas stay untracked.\nNothing generated is committed.\n\n## Commands\n\n```sh\npnpm install\npnpm dev                         # Tauri desktop development app\npnpm build                       # Vue typecheck and production build\npnpm tauri                       # build CLI sidecar and Karen.app bundles\ncargo xtask lint\ncargo xtask test\n```\n\nUse `specify` skill's `scripts/specify.mjs` for RFC lifecycle operations.\nResolve script path from the installed skill, then validate RFCs and run `sync-check` after RFC\nstatus or archive changes. Approved RFCs gate implementation; do not hand-edit\n`.spec/ROADMAP.md` or `.spec/TASK_TRACKING.md`.\n\n## Invariants\n\n1. **Disk sizes use allocated bytes** (`st_blocks * 512`) unless apparent size\n   was requested. Keep platform-specific allocation semantics in the scanner.\n2. **Directory totals are derived.** `tree::aggregate` calculates bytes, files\n   and directories from leaves. Never patch aggregate values directly.\n3. **A directory is built after its scan and every child task finish.** The\n   pending sentinel prevents silently dropping unfinished subtrees.\n4. **Removal is limited to marked paths under the scanned root.** Preserve\n   mount, root, home, parent-of-home and symlink-target guards in\n   `monitor-disk/src/removal.rs`.\n5. **Marks use absolute paths.** Refresh sizes after scans and discard missing\n   paths; never key marks by tile position.\n6. **Treemap is one Canvas.** Draw fills first, then selected/hover/mark\n   outlines, then labels clipped to each tile's owned header or rectangle.\n   Hover changes stroke only; it never changes tile order, DOM order or z-index.\n7. **Tile crumbs are absolute from scan root.** Navigation, selection and\n   marks must resolve from the original root at every depth.\n8. **Zoom changes view transform only.** Keep layout in base coordinates and\n   cache geometry until data, viewport or layout options change.\n9. **Free-space projection follows mount source.** A mark on a nested mounted\n   volume must not inflate free space for the volume shown by the meter.\n10. **Tauri is a shell.** No monitor crate dependencies, filesystem access,\n    arbitrary shell access or duplicated business logic in the desktop host.\n\n## Change ownership\n\n| change | location |\n| --- | --- |\n| scan, filters, parallelism | `crates/monitor-disk/src/scan.rs` |\n| node structure and totals | `crates/monitor-disk/src/tree.rs` |\n| tile geometry | `crates/monitor-disk/src/treemap.rs` |\n| removal safety | `crates/monitor-disk/src/removal.rs` |\n| free-space measurements | `crates/monitor-disk/src/space.rs` |\n| application state and CLI protocol | `crates/monitor-core/`, `apps/cli/` |\n| CPU and memory sampling | `crates/monitor-cpu/`, `crates/monitor-memory/` |\n| screen layout and controls | `apps/desktop/src/App.vue` |\n| treemap paint and hit testing | `apps/desktop/src/treemap.ts` |\n| visual tokens and window chrome | `apps/desktop/src/style.css` |\n\nKeep comments focused on reasons. Preserve disk semantics and removal guards\nwhen changing presentation. Follow `.agents/skills/karen-design/SKILL.md` for\nvisual work and inspect each affected view at practical window sizes."},"source-a54ff182c7e8acf5-s1":{"body":"来源：`AGENTS.md:1-7`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Karen — agent guide\n\nKaren is a Rust CLI system monitor with a Tauri 2 + Vue 3 desktop shell. The\nCLI owns scanning, telemetry, tree state, marks, review and removal. The desktop\nforwards JSON lines and renders bounded data. Do not add a second backend in\nVue or Tauri.\n"},"source-a54ff182c7e8acf5-s2":{"body":"来源：`AGENTS.md:8-31`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Product layout\n\n| path | responsibility |\n| --- | --- |\n| `apps/cli/` | standalone CLI and `--stream-json` protocol |\n| `apps/desktop/src-tauri/` | Tauri window and scoped CLI sidecar |\n| `apps/desktop/src/` | Vue views, custom window chrome and Canvas treemap |\n| `crates/monitor-core/` | CLI-owned application state and orchestration |\n| `crates/monitor-cpu/` | read-only CPU sampling |\n| `crates/monitor-memory/` | read-only memory sampling |\n| `crates/monitor-disk/` | scan, tree, layout, space and guarded removal |\n| `.agents/skills/karen-de onitor-cpu/`, `crates/monitor-memory/` |\n| screen layout and controls | `apps/desktop/src/App.vue` |\n| treemap paint and hit testing | `apps/desktop/src/treemap.ts` |\n| visual tokens and window chrome | `apps/desktop/src/style.css` |\n\nKeep comments focused on reasons. Preserve disk semantics and removal guards\nwhen changing presentation. Follow `.agents/skills/karen-design/SKILL.md` for\nvisual work and inspect each affected view at practical window sizes."},"folder:reference:apps":{"body":"# apps\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:apps/desktop":{"body":"# apps/desktop\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-b688592ee8ed258b":{"body":"# apps/desktop/PRODUCT.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/karen-design/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Product\n\n\u003c!-- impeccable:product-schema 1 -->\n\n## Platform\n\nweb\n\n## Users\n\nPeople monitoring resource use on their local computer and locating directories\nthat occupy disk space.\n\n## Product Purpose\n\nKaren monitors processor load, physical memory, mounted volume capacity, and\ndirectory space. Success means users can read current resource pressure and\nfind where disk space is used without leaving the desktop app.\n\n## Positioning\n\nKaren is a local system monitor whose Tauri window delegates sampling and disk\nscanning to the `karen --stream-json` CLI. The CLI owns measurements and disk\ntree layout; the Vue interface presents its events.\n\n## Operating Context\n\nKaren runs as a desktop app. Users move between focused resource tabs and\nthe disk tree, which supports volume selection and directory zoom.\n\n## Capabilities and Constraints\n\n- Resource views cover processor load, physical memory, and mounted volumes.\n- Disk Tree maps directory sizes and zooms into directories.\n- Tauri is a shell around the CLI stream protocol; it does not sample or scan.\n- Measurements and scans stay local.\n- Deletion and cleanup flows are outside the current monitor UI scope.\n\n## Brand Commitments\n\n- Product name: Karen.\n- Visual direction: luxurious steampunk, explicitly requested by the user.\n- The interface is a system monitor, not a web page or marketing dashboard.\n\n## Evidence on Hand\n\n- Resource and volume events are implemented in `apps/cli/src/stream_json.rs`.\n- Disk scanning and squarified treemap layout live in `crates/monitor-disk`.\n- No third-party performance claims, benchmark data, or user testimonials are\n  available; do not fabricate them.\n\n## Product Principles\n\n- Keep monitoring local.\n- Give each resource a focused view.\n- Keep the disk tree directly accessible.\n- Keep measurement and scan logic in the CLI and core crates."},"source-b688592ee8ed258b-s1":{"body":"来源：`apps/desktop/PRODUCT.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Product\n\n\u003c!-- impeccable:product-schema 1 -->\n"},"source-b688592ee8ed258b-s2":{"body":"来源：`apps/desktop/PRODUCT.md:5-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Platform\n\nweb\n"},"source-b688592ee8ed258b-s3":{"body":"来源：`apps/desktop/PRODUCT.md:9-13`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Users\n\nPeople monitoring resource use on their local computer and locating directories\nthat occupy disk space.\n"},"source-b688592ee8ed258b-s4":{"body":"来源：`apps/desktop/PRODUCT.md:14-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Product Purpose\n\nKaren monitors processor load, physical memory, mounted volume capacity, and\ndirectory space. Success means users can read current resource pressure and\nfind where disk space is used without leaving the desktop app.\n"},"source-b688592ee8ed258b-s5":{"body":"来源：`apps/desktop/PRODUCT.md:20-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Positioning\n\nKaren is a local system monitor whose Tauri window delegates sampling and disk\nscanning to the `karen --stream-json` CLI. The CLI owns measurements and disk\ntree layout; the Vue interface presents its events.\n"},"source-b688592ee8ed258b-s6":{"body":"来源：`apps/desktop/PRODUCT.md:26-30`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Operating Context\n\nKaren runs as a desktop app. Users move between focused resource tabs and\nthe disk tree, which supports volume selection and directory zoom.\n"},"source-b688592ee8ed258b-s7":{"body":"来源：`apps/desktop/PRODUCT.md:31-38`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Capabilities and Constraints\n\n- Resource views cover processor load, physical memory, and mounted volumes.\n- Disk Tree maps directory sizes and zooms into directories.\n- Tauri is a shell around the CLI stream protocol; it does not sample or scan.\n- Measurements and scans stay local.\n- Deletion and cleanup flows are outside the current monitor UI scope.\n"},"source-b688592ee8ed258b-s8":{"body":"来源：`apps/desktop/PRODUCT.md:39-44`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Brand Commitments\n\n- Product name: Karen.\n- Visual direction: luxurious steampunk, explicitly requested by the user.\n- The interface is a system monitor, not a web page or marketing dashboard.\n"},"source-b688592ee8ed258b-s9":{"body":"来源：`apps/desktop/PRODUCT.md:45-51`\n\n约束来源图 / Co cess usage monitor |\n| [0004](0004-tauri-vue3-desktop.md) | Migrate Karen desktop UI from GPUI to Tauri and Vue 3 |\n| [0003](0003-cpu-memory-resource-monitor.md) | CPU and memory monitoring with disk space management |\n| [0002](rejected/0002-rebrand-karen.md) | Superseded application identity transition |\n\n## Acceptance\n\nClose when both listed children are implemented and their acceptance evidence is recorded. Keep each child independently scoped; never reopen this umbrella for follow-up features."},"source-248b606a9e8c6284-s1":{"body":"来源：`.spec/rfc/0001-karen-system-resource-app.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0001: Karen system resource app (Umbrella)\n\n**Status:** Draft\n\n**Type:** Umbrella\n"},"source-248b606a9e8c6284-s2":{"body":"来源：`.spec/rfc/0001-karen-system-resource-app.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nBuild Karen as a Rust desktop resource-monitoring app that combines disk-space analysis and guarded cleanup with CPU and memory monitoring. This umbrella tracks the desktop migration and resource-monitoring work through separate child RFCs.\n"},"source-248b606a9e8c6284-s3":{"body":"来源：`.spec/rfc/0001-karen-system-resource-app.md:11-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nThe product direction spans independently reviewable concerns: migrating the desktop app to Karen's CLI and Tauri/Vue architecture, and adding live CPU/memory views alongside disk-space management.\n"},"source-248b606a9e8c6284-s4":{"body":"来源：`.spec/rfc/0001-karen-system-resource-app.md:15-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\nBoth child RFCs are implemented and their acceptance criteria pass. Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-2fc4b0f81ae92662":{"body":"# .spec/rfc/rejected/0002-rebrand-karen.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0002: Application identity transition (child of 0001)\n\n**Status:** Superseded\n\n**Superseded by:** RFC 0004.\n\n**Parent:** [0001](../0001-karen-system-resource-app.md)\n\n## Summary\n\nThis proposal covered the desktop product identity and compatibility during the original migration. RFC 0004 replaced its compatibility requirements with the Karen CLI, Tauri, and Vue architecture.\n\n## Problem\n\nThe expanded system monitor required a product identity and desktop architecture that covered disk, CPU, and memory workflows.\n\n## Goals\n\nUse Karen consistently for the product, command, desktop bundle, and release artifacts.\n\n## Superseded design\n\nThe original proposal retained prior command, package, installation, and macOS bundle identities. RFC 0004 explicitly replaces that approach. This archived record does not define current naming or compatibility requirements.\n\n## Acceptance\n\nSuperseded by RFC 0004; no implementation remains in scope."},"source-2fc4b0f81ae92662-s1":{"body":"来源：`.spec/rfc/rejected/0002-rebrand-karen.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0002: Application identity transition (child of 0001)\n\n**Status:** Superseded\n\n**Superseded by:** RFC 0004.\n\n**Parent:** [0001](../0001-karen-system-resource-app.md)\n"},"source-2fc4b0f81ae92662-s2":{"body":"来源：`.spec/rfc/rejected/0002-rebrand-karen.md:9-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nThis proposal covered the desktop product identity and compatibility during the original migration. RFC 0004 replaced its compatibility requirements with the Karen CLI, Tauri, and Vue architecture.\n"},"source-2fc4b0f81ae92662-s3":{"body":"来源：`.spec/rfc/rejected/0002-rebrand-karen.md:13-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nThe expanded system monitor required a product identity and desktop architecture that covered disk, CPU, and memory workflows.\n"},"source-2fc4b0f81ae92662-s4":{"body":"来源：`.spec/rfc/rejected/0002-rebrand-karen.md:17-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\nUse Karen consistently for the product, command, desktop bundle, and release artifacts.\n"},"source-2fc4b0f81ae92662-s5":{"body":"来源：`.spec/rfc/rejected/0002-rebrand-karen.md:21-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Superseded design\n\nThe original proposal retained prior command, package, installation, and macOS bundle identities. RFC 0004 explicitly replaces that approach. This archived record does not define current naming or compatibility requirements.\n"},"source-2fc4b0f81ae92662-s6":{"body":"来源：`.spec/rfc/rejected/0002-rebrand-karen.md:25-27`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\nSuperseded by RFC 0004; no implementation remains in scope."},"source-9b4f100217209349":{"body":"# .spec/rfc/0003-cpu-memory-resource-monitor.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0003: CPU and memory monitoring with disk space management (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n\n## Summary\n\nAdd live CPU and memory monitoring to Karen's existing disk-space management view. Show CPU and memory meters beside the disk panel while retaining the existing disk treemap, marked-path review, deletion guards, and free-space projections.\n\n## Problem\n\nKaren's intended scope is system resource management, but the current app only explores and frees disk space. CPU and memory readings complete the requested resource overview without weakening the disk workflow's safety invariants.\n\n## Goals\n\nProvide readable current CPU utilization and memory usage, refreshed on a bounded interval, alongside navigation to existing disk-space management. Collection is read-only and unprivileged. Define per-platform collection semantics for Linux, macOS, and Windows, including unavailable readings and platform-specific memory definitions. Keep sampling and presentation separate from filesystem scanning.\n\n## Non-goals\n\nPer-process monitoring or termination, performance tuning, alerts, history/recording, remote telemetry, privileged access, swap/cache clearing, and changes to disk deletion behavior.\n\n## Design\n\nAdd a small platform-neutral resource sample model backed by the existing cross-platform `sysinfo` dependency. Keep sampling in its own module and render compact CPU and memory meters in the side panel beside disk space. Do not add a separate screen or embed resource polling into the disk scan or treemap. Use bounded sampling, handle CPU counter warm-up and unavailable memory explicitly, and retain no history. Preserve all current disk-space projections and removal guards.\n\n## Acceptance\n\nUnit-test CPU delta calculations, memory totals/availability handling, warm-up, and unavailable samples with deterministic fixtures. Add window-harness coverage for navigation, rendering valid and unavailable readings, and returning to disk management. Run existing core/app tests, lint, and builds on Linux, macOS, and Windows. Manually confirm readings update while the disk tree remains usable and no collector requires elevated privileges."},"source-9b4f100217209349-s1":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0003: CPU and memory monitoring with disk space management (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n"},"source-9b4f100217209349-s2":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nAdd live CPU and memory monitoring to Karen's existing disk-space management view. Show CPU and memory meters beside the disk panel while retaining the existing disk treemap, marked-path review, deletion guards, and free-space projections.\n"},"source-9b4f100217209349-s3":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:11-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nKaren's intended scope is system resource management, but the current app only explores and frees disk space. CPU and memory readings complete the requested resource overview without weakening the disk workflow's safety invariants.\n"},"source-9b4f100217209349-s4":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:15-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\nProvide readable current CPU utilization and memory usage, refreshed on a bounded interval, alongside navigation to existing disk-space management. Collection is read-only and unprivileged. Define per-platform collection semantics for Linux, macOS, and Windows, including unavailable readings and platform-specific memory definitions. Keep sampling and presentation separate from filesystem scanning.\n"},"source-9b4f100217209349-s5":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:19-22`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Non-goals\n\nPer-process monitoring or termination, performance tuning, alerts, history/recording, remote telemetry, privileged access, swap/cache clearing, and changes to disk deletion behavior.\n"},"source-9b4f100217209349-s6":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:23-26`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design\n\nAdd a small platform-neutral resource sample model backed by the existing cross-platform `sysinfo` dependency. Keep sampling in its own module and render compact CPU and memory meters in the side panel beside disk space. Do not add a separate screen or embed resource polling into the disk scan or treemap. Use bounded sampling, handle CPU counter warm-up and unavailable memory explicitly, and retain no history. Preserve all current disk-space projections and removal guards.\n"},"source-9b4f100217209349-s7":{"body":"来源：`.spec/rfc/0003-cpu-memory-resource-monitor.md:27-29`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\nUnit-test CPU delta calculations, memory totals/availability handling, warm-up, and unavailable samples with deterministic fixtures. Add window-harness coverage for navigation, rendering valid and unavailable readings, and returning to disk management. Run existing core/app tests, lint, and builds on Linux, macOS, and Windows. Manually confirm readings update while the disk tree remains usable and no collector requires elevated privileges."},"source-501ed7f2d3676fd7":{"body":"# .spec/rfc/0004-tauri-vue3-desktop.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0004: Migrate Karen desktop UI from GPUI to Tauri and Vue 3 (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n\n## Summary\n\nReplace Karen's GPUI interface with `Karen.app`, a Tauri 2 + Vue 3 desktop\nshell around the standalone Karen CLI. The CLI is sole owner of application\nstate and all work. Karen.app starts the bundled CLI in `--stream-json` mode\nand forwards its JSON stream between the Vue interface and CLI.\n\n## Problem\n\nKaren currently depends on GPUI for its window and interface. Product shape\nis a useful standalone CLI first, then Karen.app as its desktop shell. Tauri\nmust not reimplement business logic or call backend crates directly. The CLI\nneeds a machine-readable streaming mode that can serve an interactive app\nwithout copying the complete tree to Vue or keeping two copies of application\nstate.\n\n## Goals\n\n* Ship `Karen.app` as a Tauri 2 desktop shell with Vue 3 and TypeScript under\n  `apps/desktop/`.\n* Rename the disk library package to `monitor-disk`; add\n  `monitor-core` for app-level orchestration, `monitor-memory` for memory\n  sampling, and `monitor-cpu` for CPU sampling. Keep each crate limited to its\n  named responsibility.\n* Keep standalone `karen` CLI in `apps/cli/` as the only application backend.\n  `Karen.app` starts the bundled CLI with `--stream-json`; Tauri only owns the\n  window, CLI process lifecycle and byte/JSON-line forwarding to Vue.\n* Preserve the current user-visible flows: CPU and memory meters, disk free\n  space, treemap navigation and zoom, filters, selection details, marks,\n  review, confirmation, safe removal, and scan controls.\n* Keep filesystem semantics and destructive-operation guards in\n  `monitor-disk`, called only by the CLI; neither Tauri nor Vue performs file\n  operations.\n* Keep scan and removal work in CLI process. Stream progress and bounded view\n  data to Vue; do not serialize or clone the complete tree for each redraw or\n  interaction.\n* Preserve supported Linux, macOS and Windows builds, existing command-line\n  scan arguments under the `karen` command, installation upgrades and user\n  settings. Use Karen's new application identity consistently.\n* Retain projectify layout boundaries: Rust reusable code in `crates/`,\n  executable desktop app in `apps/desktop/`, TypeScript packages in\n  `packages/` only when shared modules actually exist, and pnpm scripts at the\n  root to coordinate Cargo and frontend commands.\n\n## Non-goals\n\n* New monitoring features, process lists or process termination, resource\n  history, remote telemetry, auto-cleanup, and privileged collection.\n* Changes to scan accounting, mount attribution, marks semantics, or removal\n  policy except fixes required to preserve those contracts across the bridge.\n* Mobile targets, a web-hosted edition, a new CLI product, or a new package\n  publishing workflow.\n* Branding redesign, registry renaming, and domain changes.\n* Compatibility aliases or metadata using the retired product identity,\n  desktop entry, release artifact, or runtime compatibility layer. This\n  migration removes the old identity rather than preserving it.\n\n## Design\n\nCreate `apps/cli/` for standalone `karen` and `apps/desktop/` for `Karen.app`.\nKeep Tauri Rust host and `tauri.conf.json` under\n`apps/desktop/src-tauri/`; keep Vue/Vite app, views, styles, Canvas treemap\nand the pass-through bridge under\n`apps/desktop/src/`. Add a root `pnpm-workspace.yaml` and root scripts only to\ncoordinate the Vue desktop package and existing Cargo commands. Keep\nreusable Rust crates in the Cargo workspace: move the current\ndisk library implementation to `crates/monitor-disk/` and rename\nits Cargo package/library to `monitor-disk`; move app lifecycle and\ncross-domain orchestration into `crates/monitor-core/`; move memory and CPU\nsampling into `crates/monitor-memory/` and `crates/monitor-cpu/`. Put CLI\nargument parsing, terminal output and the `--stream-json` entry point in\n`apps/cli/`. `monitor-core` owns app state and orchestration and is used by CLI\nonly; Tauri must not depend on it or any other monitor crate.\n\nImplement `karen --stream-json` as CLI's long-lived machine interface. It\nreads JSON request lines on stdin, validates each request, and writes typed\nJSON event lines on stdout. Define versioned request and event envelopes for\nscan/start/cancel, tree navigation, filters, marks, review, removal\nconfirmation, CPU/memory samples, errors and shutdown. Send diagnostics only\nto stderr. Stream only progress and bounded visible-tile/selection data; keep\nthe full tree and marks in CLI memory. Vue sends actions to the CLI through\nthe scoped Tauri Shell sidecar child's stdin and renders events from stdout.\nThe CLI owns all validation and destructive-operation guards.\n\nKaren.app bundles the matching-platform `karen` executable as a Tauri sidecar.\nVue uses the scoped Tauri Shell plugin to start it with exactly\n`--stream-json`, keep one process for the app session, write request lines,\nand read event lines. Tauri Rust host contains no app-specific bridge or\nbusiness logic; Vue handles the view and CLI handles all work. Scope shell\npermissions to this sidecar and fixed mode argument. Do not expose general\nshell execution to Vue. Keep frontend code in `apps/desktop/`, not in\n`packages/` unless a second consumer creates a real shared package. Do not\ncreate placeholder crates or a generic plugin framework. Retire\nthe legacy GPUI app crate and dependencies only after the replacement passes\nthe acceptance checks.\n\n`monitor-core`, called by CLI, owns one application state containing active\nscan, `monitor_disk::Node` tree, marks, scan options, CPU/memory samples,\nremoval plan and task handles. `monitor-disk` owns filesystem scanning, tree\naccounting, treemap geometry, disk-space attribution and all removal guards.\n`monitor-memory` and `monitor-cpu` own bounded, read-only metric sampling.\nScan and removal tasks remain asynchronous and emit progress/status events.\nCLI computes layouts with `monitor-disk` and streams only the bounded visible\nresult, selection details and sibling lists. Do not add serde derives to the\ncompact core node solely to serialize the full tree. Use stable absolute paths\nfor marks and revalidate selected removal targets through the core planner\nbefore confirmation and execution.\n\nRebuild interface layout and input in Vue, drawing CLI-provided treemap\nrectangles and labels in one Canvas surface so thousands of tiles do not\nbecome thousands of DOM elements. Use Tauri APIs only for shell behavior such\nas window and sidecar lifecycle. Declare minimum Tauri capabilities needed\nfor the sidecar; do not grant arbitrary shell execution or filesystem access\nto Vue. Preserve platform-specific scan/removal implementations and existing application data\nlocations. Use the Karen application and bundle identity `me.systembug.karen`\nconsistently across platforms. Rename the executable and release artifacts to\nKaren names, remove compatibility aliases and metadata using the retired\nidentity, and update\nthe desktop entry, packaging, docs and workflows to match. This intentionally\nchanges the macOS bundle identifier and therefore requests fresh macOS\npermissions; do not claim old Full Disk Access grants carry over.\n\nUpdate Cargo workspace membership, release workflow, install/bundle commands,\nREADME build/run instructions and CI to build the CLI sidecar and Vue frontend\nbefore Tauri packaging. The\nexisting GPUI changes in the working tree are user-owned input; migration must\nincorporate or explicitly reconcile them, never discard them implicitly.\n\n## Acceptance\n\n* Cargo package boundaries are `monitor-core`, `monitor-disk`,\n  `monitor-memory`, `monitor-cpu`, and the Tauri desktop host; no production\n  dependency, command, bundle, desktop entry or release artifact retains the\n  retired identity.\n* `karen` CLI runs without opening a window. `karen --stream-json` accepts\n  versioned JSON requests and emits parseable JSON event lines for the full\n  interactive workflow; diagnostics stay on stderr.\n* Karen.app bundles and starts `karen --stream-json`; Tauri has no monitor\n  crate dependency and contains no scan, tree, metrics, marks or removal\n  business logic. Vue actions and CLI events traverse the sidecar stream.\n* `pnpm` install, frontend lint/typecheck/build and Tauri dev launch work from\n  the documented root commands; `cargo xtask lint`, core tests and Tauri app\n  tests pass without GPUI in the production dependency graph.\n* Linux, macOS and Windows release builds produce standalone `karen` CLI and\n  launchable `Karen.app` artifacts with matching sidecar architecture. `karen`\n  scan arguments and installer upgrade/uninstall behavior remain verified.\n* Automated frontend/window coverage exercises scan progress, empty/error\n  states, navigation/filtering, marking and review, cancellation, and removal\n  confirmation. Core deletion-guard tests remain authoritative for what may\n  be removed.\n* Exercise a large synthetic tree and demonstrate that the frontend bridge\n  returns bounded view data without serializing the full `Node` tree on every\n  interaction.\n* Verify settings remain available after the new identity is installed, and\n  check that Tauri capabilities expose no direct arbitrary path deletion.\n* Reconcile README, desktop metadata, release names and actual artifact names;\n  run `specify validate` and `sync-check` after this RFC is approved and\n  implementation is complete."},"source-501ed7f2d3676fd7-s1":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0004: Migrate Karen desktop UI from GPUI to Tauri and Vue 3 (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n"},"source-501ed7f2d3676fd7-s2":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:7-13`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nReplace Karen's GPUI interface with `Karen.app`, a Tauri 2 + Vue 3 desktop\nshell around the standalone Karen CLI. The CLI is sole owner of application\nstate and all work. Karen.app starts the bundled CLI in `--stream-json` mode\nand forwards its JSON stream between the Vue interface and CLI.\n"},"source-501ed7f2d3676fd7-s3":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:14-22`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nKaren currently depends on GPUI for its window and interface. Product shape\nis a useful standalone CLI first, then Karen.app as its desktop shell. Tauri\nmust not reimplement business logic or call backend crates directly. The CLI\nneeds a machine-readable streaming mode that can serve an interactive app\nwithout copying the complete tree to Vue or keeping two copies of application\nstate.\n"},"source-501ed7f2d3676fd7-s4":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:23-50`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\n* Ship `Karen.app` as a Tauri 2 desktop shell with Vue 3 and TypeScript under\n  `apps/desktop/`.\n* Rename the disk library package to `monitor-disk`; add\n  `monitor-core` for app-level orchestration, `monitor-memory` for memory\n  sampling, and `monitor-cpu` for CPU sampling. Keep each crate limited to its\n  named responsibility.\n* Keep standalone `karen` CLI in `apps/cli/` as the only application backend.\n  `Karen.app` starts the bundled CLI with `--stream-json`; Tauri only owns the\n  window, CLI process lifecycle and byte/JSON-line forwarding to Vue.\n* Preserve the current user-visible flows: CPU and memory meters, disk free\n  space, treemap navigation and zoom, filters, selection details, marks,\n  review, confirmation, safe removal, and scan controls.\n* Keep filesystem semantics and destructive-operation guards in\n  `monitor-disk`, called only by the CLI; neither Tauri nor Vue performs file\n  operations.\n* Keep scan and removal work in CLI process. Stream progress and bounded view\n  data to Vue; do not serialize or clone the complete tree for each redraw or\n  interaction.\n* Preserve supported Linux, macOS and Windows builds, existing command-line\n  scan arguments under the `karen` command, installation upgrades and user\n  settings. Use Karen's new application identity consistently.\n* Retain projectify layout boundaries: Rust reusable code in `crates/`,\n  executable desktop app in `apps/desktop/`, TypeScript packages in\n  `packages/` only when shared modules actually exist, and pnpm scripts at the\n  root to coordinate Cargo and frontend commands.\n"},"source-501ed7f2d3676fd7-s5":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:51-63`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Non-goals\n\n* New monitoring features, process lists or process termination, resource\n  history, remote telemetry, auto-cleanup, and privileged collection.\n* Changes to scan accounting, mount attribution, marks semantics, or removal\n  policy except fixes required to preserve those contracts across the bridge.\n* Mobile targets, a web-hosted edition, a new CLI product, or a new package\n  publishing workflow.\n* Branding redesign, registry renaming, and domain changes.\n* Compatibility aliases or metadata using the retired product identity,\n  desktop entry, release artifact, or runtime compatibility layer. This\n  migration removes the old identity rather than preserving it.\n"},"source-501ed7f2d3676fd7-s6":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:64-134`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design\n\nCreate `apps/cli/` for standalone `karen` and `apps/desktop/` for `Karen.app`.\nKeep Tauri Rust host and `tauri.conf.json` under\n`apps/desktop/src-tauri/`; keep Vue/Vite app, views, styles, Canvas treemap\nand the pass-through bridge under\n`apps/desktop/src/`. Add a root `pnpm-workspace.yaml` and root scripts only to\ncoordinate the Vue desktop package and existing Cargo commands. Keep\nreusable Rust crates in the Cargo workspace: move the current\ndisk library implementation to `crates/monitor-disk/` and rename\nits Cargo package/library to `monitor-disk`; move app lifecycle and\ncross-domain orchestration into `crates/monitor-core/`; move memory and CPU\nsampling into `crates/monitor-memory/` and `crates/monitor-cpu/`. Put CLI\nargument parsing, terminal output and the `--stream-json` entry point in\n`apps/cli/`. `monitor-core` owns app state and orchestration and is used by CLI\nonly; Tauri must not depend on it or any other monitor crate.\n\nImplement `karen --stream-json` as CLI's long-lived machine interface. It\nreads JSON request lines on stdin, validates each request, and writes typed\nJSON event lines on stdout. Define versioned request and event envelopes for\nscan/start/cancel, tree navigation, filters, marks, review, removal\nconfirmation, CPU/memory samples, errors and shutdown. Send diagnostics only\nto stderr. Stream only progress and bounded visible-tile/selection data; keep\nthe full tree and marks in CLI memory. Vue sends actions to the CLI through\nthe scoped Tauri Shell sidecar child's stdin and renders events from stdout.\nThe CLI owns all validation and destructive-operation guards.\n\nKaren.app bundles the matching-platform `karen` executable as a Tauri sidecar.\nVue uses the scoped Tauri Shell plugin to start it with exactly\n`--stream-json`, keep one process for the app session, write request lines,\nand read event lines. Tauri Rust host contains no app-specific bridge or\nbusiness logic; Vue handles the view and CLI handles all work. Scope shell\npermissions to this sidecar and fixed mode argument. Do not expose general\nshell execution to Vue. Keep frontend code in `apps/desktop/`, not in\n`packages/` unless a second consumer creates a real shared package. Do not\ncreate placeholder crates or a generic plugin framework. Retire\nthe legacy GPUI app crate and dependencies only after the replacement passes\nthe acceptance checks.\n\n`monitor-core`, called by CLI, owns one application state containing active\nscan, `monitor_disk::Node` tree, marks, scan options, CPU/memory samples,\nremoval plan and task handles. `monitor-disk` owns filesystem scanning, tree\naccounting, treemap geometry, disk-space attribution and all removal guards.\n`monitor-memory` and `monitor-cpu` own bounded, read-only metric sampling.\nScan and removal tasks remain asynchronous and emit progress/status events.\nCLI computes layouts with `monitor-disk` and streams only the bounded visible\nresult, selection details and sibling lists. Do not add serde derives to the\ncompact core node solely to serialize the full tree. Use stable absolute paths\nfor marks and revalidate selected removal targets through the core planner\nbefore confirmation and execution.\n\nRebuild interface layout and input in Vue, drawing CLI-provided treemap\nrectangles and labels in one Canvas surface so thousands of tiles do not\nbecome thousands of DOM elements. Use Tauri APIs only for shell behavior such\nas window and sidecar lifecycle. Declare minimum Tauri capabilities needed\nfor the sidecar; do not grant arbitrary shell execution or filesystem access\nto Vue. Preserve platform-specific scan/removal implementations and existing application data\nlocations. Use the Karen application and bundle identity `me.systembug.karen`\nconsistently across platforms. Rename the executable and release artifacts to\nKaren names, remove compatibility aliases and metadata using the retired\nidentity, and update\nthe desktop entry, packaging, docs and workflows to match. This intentionally\nchanges the macOS bundle identifier and therefore requests fresh macOS\npermissions; do not claim old Full Disk Access grants carry over.\n\nUpdate Cargo workspace membership, release workflow, install/bundle commands,\nREADME build/run instructions and CI to build the CLI sidecar and Vue frontend\nbefore Tauri packaging. The\nexisting GPUI changes in the working tree are user-owned input; migration must\nincorporate or explicitly reconcile them, never discard them implicitly.\n"},"source-501ed7f2d3676fd7-s7":{"body":"来源：`.spec/rfc/0004-tauri-vue3-desktop.md:135-164`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\n* Cargo package boundaries are `monitor-core`, `monitor-disk`,\n  `monitor-memory`, `monitor-cpu`, and the Tauri desktop host; no production\n  dependency, command, bundle, desktop entry or release artifact retains the\n  retired identity.\n* `karen` CLI runs without opening a window. `karen --stream-json` accepts\n  versioned JSON requests and emits parseable JSON event lines for the full\n  interactive workflow; diagnostics stay on stderr.\n* Karen.app bundles and starts `karen --stream-json`; Tauri has no monitor\n  crate dependency and contains no scan, tree, metrics, marks or removal\n  business logic. Vue actions and CLI events traverse the sidecar stream.\n* `pnpm` install, frontend lint/typecheck/build and Tauri dev launch work from\n  the documented root commands; `cargo xtask lint`, core tests and Tauri app\n  tests pass without GPUI in the production dependency graph.\n* Linux, macOS and Windows release builds produce standalone `karen` CLI and\n  launchable `Karen.app` artifacts with matching sidecar architecture. `karen`\n  scan arguments and installer upgrade/uninstall behavior remain verified.\n* Automated frontend/window coverage exercises scan progress, empty/error\n  states, navigation/filtering, marking and review, cancellation, and removal\n  confirmation. Core deletion-guard tests remain authoritative for what may\n  be removed.\n* Exercise a large synthetic tree and demonstrate that the frontend bridge\n  returns bounded view data without serializing the full `Node` tree on every\n  interaction.\n* Verify settings remain available after the new identity is installed, and\n  check that Tauri capabilities expose no direct arbitrary path deletion.\n* Reconcile README, desktop metadata, release names and actual artifact names;\n  run `specify validate` and `sync-check` after this RFC is approved and\n  implementation is complete."},"folder:reference:.spec/rfc/completed":{"body":"# .spec/rfc/completed\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-176c9576f40b3236":{"body":"# .spec/rfc/completed/0005-cpu-process-usage.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0005: CPU process usage monitor (child of 0001)\n\n**Status:** Implemented\n\n**Parent:** [0001](../0001-karen-system-resource-app.md)\n\n## Summary\n\nExpose a bounded, live list of processes ranked by CPU usage on Karen's\nRuntime tab. The CLI owns process sampling and sends process rows through its\nexisting `--stream-json` protocol; the Tauri shell remains a transport and the\nVue UI renders the result.\n\n## Problem\n\nThe Runtime tab currently reports only whole-machine CPU utilization. That\nshows load but cannot identify which process causes it. RFC 0003 explicitly\nexcluded per-process monitoring, so this capability needs its own RFC and\nacceptance boundary.\n\n## Goals\n\nShow the highest CPU-consuming processes, with process name, PID, and CPU\npercentage. Refresh on the existing bounded resource-sampling cadence, keep\nthe list capped, and handle process names or CPU readings unavailable from the\noperating system.\n\n## Non-goals\n\nProcess memory, process termination or control, alerts, history/recording,\nremote telemetry, elevated collection, and changes to disk scanning or\ndeletion behavior.\n\n## Design\n\nExtend `monitor-cpu` to sample per-process CPU using the existing `sysinfo`\ndependency and emit normalized rows through `monitor-core`. Add a versioned\nresource event to the `karen --stream-json` protocol and update the Vue Runtime\ntab to render the bounded, descending-CPU list. Keep process collection in the\nCLI/core path; Tauri only forwards stream events. Preserve the current total\nCPU and memory fields and the stream protocol's backward-compatible handling\nof unknown events. Label process CPU with `sysinfo`'s per-core percentage\nsemantics: one fully used core is 100%, so a process may exceed 100% on a\nmulti-core system. Treat first-sample CPU deltas as unavailable until the\ncollector has a baseline; exclude non-finite or negative readings, use a safe\nfallback for empty process names, and sort ties by PID for stable display.\n\n## Acceptance\n\nOn Linux, macOS, and Windows, the CLI stream reports a bounded process CPU\nlist while retaining existing total CPU and memory readings. Rows contain a\nstable PID, display name (with a safe fallback when the OS provides none), and\nfinite CPU percentage in the documented range. The list is ordered by CPU\nusage, updates on the resource cadence, and remains empty or explicitly\nunavailable during collector warm-up. The Runtime tab visibly renders the\nprocess list and handles no-process/unavailable states. Existing disk tree\nnavigation and stream consumers continue to work unchanged. Validate with\nfocused collector/protocol coverage, lint, and desktop build; manually inspect\nthe running Runtime tab."},"source-176c9576f40b3236-s1":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0005: CPU process usage monitor (child of 0001)\n\n**Status:** Implemented\n\n**Parent:** [0001](../0001-karen-system-resource-app.md)\n"},"source-176c9576f40b3236-s2":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:7-13`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nExpose a bounded, live list of processes ranked by CPU usage on Karen's\nRuntime tab. The CLI owns process sampling and sends process rows through its\nexisting `--stream-json` protocol; the Tauri shell remains a transport and the\nVue UI renders the result.\n"},"source-176c9576f40b3236-s3":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:14-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem\n\nThe Runtime tab currently reports only whole-machine CPU utilization. That\nshows load but cannot identify which process causes it. RFC 0003 explicitly\nexcluded per-process monitoring, so this capability needs its own RFC and\nacceptance boundary.\n"},"source-176c9576f40b3236-s4":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:21-27`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goals\n\nShow the highest CPU-consuming processes, with process name, PID, and CPU\npercentage. Refresh on the existing bounded resource-sampling cadence, keep\nthe list capped, and handle process names or CPU readings unavailable from the\noperating system.\n"},"source-176c9576f40b3236-s5":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:28-33`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Non-goals\n\nProcess memory, process termination or control, alerts, history/recording,\nremote telemetry, elevated collection, and changes to disk scanning or\ndeletion behavior.\n"},"source-176c9576f40b3236-s6":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:34-47`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design\n\nExtend `monitor-cpu` to sample per-process CPU using the existing `sysinfo`\ndependency and emit normalized rows through `monitor-core`. Add a versioned\nresource event to the `karen --stream-json` protocol and update the Vue Runtime\ntab to render the bounded, descending-CPU list. Keep process collection in the\nCLI/core path; Tauri only forwards stream events. Preserve the current total\nCPU and memory fields and the stream protocol's backward-compatible handling\nof unknown events. Label process CPU with `sysinfo`'s per-core percentage\nsemantics: one fully used core is 100%, so a process may exceed 100% on a\nmulti-core system. Treat first-sample CPU deltas as unavailable until the\ncollector has a baseline; exclude non-finite or negative readings, use a safe\nfallback for empty process names, and sort ties by PID for stable display.\n"},"source-176c9576f40b3236-s7":{"body":"来源：`.spec/rfc/completed/0005-cpu-process-usage.md:48-59`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Acceptance\n\nOn Linux, macOS, and Windows, the CLI stream reports a bounded process CPU\nlist while retaining existing total CPU and memory readings. Rows contain a\nstable PID, display name (with a safe fallback when the OS provides none), and\nfinite CPU percentage in the documented range. The list is ordered by CPU\nusage, updates on the resource cadence, and remains empty or explicitly\nunavailable during collector warm-up. The Runtime tab visibly renders the\nprocess list and handles no-process/unavailable states. Existing disk tree\nnavigation and stream consumers continue to work unchanged. Validate with\nfocused collector/protocol coverage, lint, and desktop build; manually inspect\nthe running Runtime tab."},"source-cd772afa8730c301":{"body":"# .spec/rfc/0006-karen-disk-tree-ui-migration.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.spec/ROADMAP.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0006: Migrate the complete Karen interface and interactions to Vue 3 (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n\n## Summary\n\nComplete the Vue 3 migration of Karen's disk space management interface and\ninteraction model. Match the source app's screen structure and navigation:\nbreadcrumb trail with sibling jumps, volume and scan controls, scan totals,\ntreemap, selection details, marks, review, and guarded removal confirmation.\nKeep Karen's established visual identity around that structure. Directory\nnavigation and returning through breadcrumbs must use the cached scan tree,\nnot start another filesystem scan.\n\n## Problem\n\nRFC 0004 requires preserving Disk Tree navigation, selection, marks,\nreview, removal and scan controls in Karen.app. The current Vue screen only\nrenders a simplified treemap. Tile clicks start new scans, the screen has no\nbreadcrumb trail, selection panel, sibling jumps, marks or review flow, and\nswitching volumes can discard the visible tree without loading the selected\nvolume. This is an incomplete migration of the already-approved product\nbehavior.\n\n## Goals\n\nReproduce the source screen hierarchy and all existing disk\nworkflow behavior in Vue 3. Preserve treemap proportions, colors and labels;\nprovide clickable breadcrumbs and sibling navigation; show selected-node\ndetails and scan totals; preserve mark, review, confirmation, removal guards,\nvolume free-space projections and scan controls. Cache completed trees in the\nCLI for the app session so descending, ascending, sibling jumps and returning\nto a previously scanned volume do not repeat the scan. Provide an explicit\nrescan action to refresh one volume's cached tree.\n\n## Non-goals\n\nChanges to file-size accounting, scan filtering semantics, deletion policy,\nresource telemetry, process monitoring, persistent cache across app restarts,\nnew disk-management capabilities, or a redesign of the established Karen\nbrand and steampunk visual identity.\n\n## Design\n\nUse the preserved GPUI implementation in `migration/gpui-reference/` as the\nbehavioral reference. Use its README\nscreen description as the layout reference. Keep the full `Node` tree, marks,\nselection, scan root and review plan in the CLI/core. Extend the CLI JSON-line\nprotocol with bounded requests and events for cached tree navigation,\nbreadcrumbs, sibling choices, selection, marks, review and removal\nconfirmation. Keep Vue as a renderer and input surface; do not move filesystem\noperations, tree ownership or deletion policy into Tauri or Vue.\n\nThe CLI retains completed per-volume trees for the lifetime of the app process.\nNavigating within a cached tree resolves paths against that tree and returns\nonly the current bounded treemap tiles, breadcrumbs, sibling list, selection\ndetails, totals and marks summary. A cache miss starts a scan. Explicit rescan\nreplaces only that volume's cached tree after successful completion; failed or\ncancelled scans leave the prior completed tree available. Tile and breadcrumb\nactions address absolute paths so tree layout sorting cannot redirect a\nselection. Vue reproduces the source screen's hierarchy: controls and trail at\ntop, totals/filter/legend above the mosaic, mosaic as the main work surface,\nand selection/mark/volume information in its side panel, followed by a\nseparate review and confirmation flow.\n\n## Acceptance\n\nCompare each Disk Tree state and interaction against the preserved source:\ninitial scan, scan progress, root mosaic, nested directory, breadcrumb\nreturn, sibling jump, volume switch, cached revisit, explicit rescan,\nselection, mark/unmark, review, cancel, confirm and removal result. Confirm\ntile navigation, breadcrumb return and cached volume revisit issue no scan\nrequest. Confirm cache miss scans once and failed/cancelled rescan preserves\nthe prior tree. Confirm Vue receives bounded view payloads rather than a\nserialized full tree. Preserve core removal guards and free-space attribution.\nRun focused CLI/protocol and desktop coverage, Rust lint/build and desktop\nbuild; manually inspect the running app against the source screen at normal\nand large viewport sizes. Validate RFC 0004 and RFC 0006 consistency after\nimplementation."},"source-cd772afa8730c301-s1":{"body":"来源：`.spec/rfc/0006-karen-disk-tree-ui-migration.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0006: Migrate the complete Karen interface and interactions to Vue 3 (child of 0001)\n\n**Status:** Approved\n\n**Parent:** [0001](0001-karen-system-resource-app.md)\n"},"source-cd772afa8730c301-s2":{"body":"来源：`.spec/rfc/0006-karen-disk-tree-ui-migration.md:7-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Summary\n\nComplete the Vue 3 migration of Karen's disk space management interface and\ninteraction model. Match the source app's screen structure and navigation:\nbreadcrumb trail with sibling jumps, volume and scan controls, scan totals,\ntreemap, selection details, marks, review, and guarded removal confirmation.\nKeep Karen's established visual identity around that structure. Directory\nnavigation and returning through breadcrumbs must use the cached scan tree,\nnot start another filesystem scan.\n"},"source-cd772afa8730c301-s3":{"body":"来源：`.spec/rfc/0006-karen-disk-tree-ui-migration.md:17-26`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。v
